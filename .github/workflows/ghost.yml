name: AI Ghost - Fashion Engine

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate and Post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip3 install supabase requests
          python3 << 'EOF'
          import requests, os, time, random
          from supabase import create_client

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          supabase = create_client(SUPABASE_URL, SUPABASE_KEY)

          subjects = [
              "female model full body", "male model full body",
              "fashion influencer full body", "royal figure full body"
          ]
          
          styles = [
              "haute couture gown", "cyberpunk techwear", "arabic gold embroidery",
              "minimalist luxury suit", "streetwear drip", "chrome liquid metal"
          ]
          
          subject = random.choice(subjects)
          style = random.choice(styles)
          short_caption = f"{subject.split()[0]} in {style}"
          
          prompt = f"Ultra realistic full body photo of {subject} wearing {style} fashion, standing, head to toe visible, shoes visible, 8K, cinematic lighting, fashion photography"

          print(f"Generating: {prompt[:100]}...")
          print(f"Caption: {short_caption}")

          encoded = prompt.replace(" ", "%20")
          img_url = f"https://image.pollinations.ai/prompt/{encoded}?width=1080&height=1920&nologo=true"

          response = requests.get(img_url, timeout=90)

          if response.status_code == 200:
              filename = f"post_{int(time.time())}.jpg"
              supabase.storage.from_("post-images").upload(filename, response.content)
              public_url = supabase.storage.from_("post-images").get_public_url(filename)
              
              supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": short_caption,
                  "is_ai": True,
                  "likes": 0
              }).execute()
              print("✅ Posted!")
          else:
              print(f"❌ Failed: {response.status_code}")
          EOF
