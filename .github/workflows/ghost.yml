name: AI Ghost (Stable)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Run Ghost
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests supabase

          python << EOF
          import requests, time, random, os, urllib.parse
          from supabase import create_client

          print("🚀 START")

          try:
              url = os.environ["SUPABASE_URL"]
              key = os.environ["SUPABASE_KEY"]

              print("🔗 Connecting to Supabase...")
              supabase = create_client(url, key)
              print("✅ Connected")

              # =========================
              # PROMPT
              # =========================
              subject = random.choice(["female model", "male model"])
              style = random.choice(["haute couture", "streetwear", "luxury suit"])

              prompt = f"""
              RAW photo of a real human {subject},
              wearing {style},
              full body, head to toe visible,
              perfect anatomy, realistic skin,
              clean hands, five fingers,
              85mm lens, studio lighting,
              not CGI, ultra realistic
              """

              encoded = urllib.parse.quote(prompt)

              img_url = f"https://image.pollinations.ai/prompt/{encoded}?width=1024&height=1792"

              print("🌐 Fetching image...")
              try:
                  r = requests.get(img_url, timeout=60)
                  print("STATUS:", r.status_code)
              except Exception as e:
                  print("❌ IMAGE REQUEST FAILED:", e)
                  exit(0)

              if r.status_code != 200:
                  print("❌ BAD RESPONSE")
                  exit(0)

              # =========================
              # UPLOAD
              # =========================
              filename = f"{int(time.time())}.jpg"

              print("⬆️ Uploading...")
              try:
                  supabase.storage.from_("post-images").upload(
                      path=filename,
                      file=r.content,
                      file_options={"content-type": "image/jpeg"}
                  )
                  print("✅ Upload success")
              except Exception as e:
                  print("❌ UPLOAD FAILED:", e)
                  exit(0)

              # =========================
              # GET URL
              # =========================
              try:
                  public = supabase.storage.from_("post-images").get_public_url(filename)
                  public_url = public["publicUrl"] if isinstance(public, dict) else public
                  print("🌍 URL:", public_url)
              except Exception as e:
                  print("❌ URL ERROR:", e)
                  exit(0)

              # =========================
              # INSERT
              # =========================
              print("📦 Inserting post...")
              try:
                  supabase.table("posts").insert({
                      "image_url": public_url,
                      "caption": f"{subject} in {style}",
                      "is_ai": True,
                      "likes": 0
                  }).execute()
                  print("✅ INSERT SUCCESS")
              except Exception as e:
                  print("❌ INSERT FAILED:", e)
                  exit(0)

              print("🎉 DONE")

          except Exception as e:
              print("🔥 FATAL ERROR:", e)
              exit(0)
          EOF
