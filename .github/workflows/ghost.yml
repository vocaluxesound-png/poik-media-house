name: AI Ghost - Generate Every 10 Minutes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate and Post AI Image
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip3 install supabase requests --quiet
          
          python3 << 'EOF'
          import requests, os, time, random
          from supabase import create_client
          
          SUPABASE_URL = os.environ.get("SUPABASE_URL")
          SUPABASE_KEY = os.environ.get("SUPABASE_KEY")
          supabase = create_client(SUPABASE_URL, SUPABASE_KEY)
          
          # Prompts for realistic images
          prompts = [
              "fashion model cyberpunk city night rain neon lights",
              "luxury sports car tokyo street night reflections",
              "japanese garden autumn cherry blossoms sunset",
              "northern lights mountains snow lake reflection"
          ]
          
          prompt = random.choice(prompts)
          print(f"Generating: {prompt}")
          
          # Pollinations AI (free)
          url = f"https://image.pollinations.ai/prompt/{prompt.replace(' ', '%20')}?width=1080&height=1920"
          
          response = requests.get(url, timeout=60)
          print(f"Status: {response.status_code}")
          
          if response.status_code == 200:
              filename = f"ai_{int(time.time())}.jpg"
              
              # Upload to Supabase
              supabase.storage.from_("post-images").upload(filename, response.content)
              public_url = supabase.storage.from_("post-images").get_public_url(filename)
              
              # Save to database
              supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": prompt,
                  "is_ai": True,
                  "likes": 0
              }).execute()
              
              print("✅ Image posted!")
          else:
              print(f"❌ Failed: {response.status_code}")
          EOF
