name: AI Ghost

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ghost
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests supabase
          python << EOF
          import requests, time, random, os, urllib.parse
          from supabase import create_client

          supabase = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])

          subjects = ["female model", "male model", "fashion influencer", "runway model"]
          styles = ["haute couture", "streetwear", "futuristic chrome", "luxury suit"]
          poses = ["standing", "walking", "posing"]
          lighting = ["studio lighting", "cinematic lighting", "soft light"]

          subject = random.choice(subjects)
          style = random.choice(styles)
          pose = random.choice(poses)
          light = random.choice(lighting)

          caption = f"{subject} in {style}"

          prompt = f"""
          RAW photo of {subject},
          wearing {style},
          full body, head to toe visible,
          {pose},
          {light},
          realistic skin, perfect anatomy,
          85mm lens, high detail
          --no deformed, bad hands, extra fingers, blurry
          """

          encoded = urllib.parse.quote(prompt)
          img = f"https://image.pollinations.ai/prompt/{encoded}?width=1024&height=1792&nologo=true"

          r = requests.get(img, timeout=60)

          if r.status_code == 200:
              name = f"{int(time.time())}.jpg"
              supabase.storage.from_("post-images").upload(
                  path=name,
                  file=r.content,
                  file_options={"content-type": "image/jpeg"}
              )
              pub = supabase.storage.from_("post-images").get_public_url(name)["publicUrl"]
              supabase.table("posts").insert({
                  "image_url": pub,
                  "caption": caption,
                  "is_ai": True,
                  "likes": 0
              }).execute()
              print("Posted")
          else:
              print("Failed:", r.status_code)
          EOF
