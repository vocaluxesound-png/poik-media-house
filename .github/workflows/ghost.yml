name: AI Ghost - Simple Test

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Simple Python Test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 << 'EOF'
          import os
          print("Python started")
          print(f"URL exists: {os.environ.get('SUPABASE_URL') is not None}")
          print(f"Key exists: {os.environ.get('SUPABASE_KEY') is not None}")
          print("Test passed")
          EOF
