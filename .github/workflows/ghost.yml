name: AI Ghost

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ghost
        run: |
          pip install requests supabase
          python << EOF
          import requests, time, random, os, urllib.parse
          from supabase import create_client

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          supabase = create_client(url, key)

          prompt = "ultra realistic fashion model, full body, professional photography, 85mm lens, perfect anatomy"
          encoded = urllib.parse.quote(prompt)
          img = f"https://image.pollinations.ai/prompt/{encoded}?width=1080&height=1920&nologo=true"

          try:
              r = requests.get(img, timeout=60)
              print("Status:", r.status_code)
              if r.status_code != 200:
                  raise Exception("Image failed")
                  
              filename = f"{int(time.time())}.jpg"
              supabase.storage.from_("post-images").upload(
                  path=filename,
                  file=r.content,
                  file_options={"content-type": "image/jpeg"}
              )
              
              public = supabase.storage.from_("post-images").get_public_url(filename)["publicUrl"]
              
              supabase.table("posts").insert({
                  "image_url": public,
                  "caption": "AI Fashion",
                  "is_ai": True,
                  "likes": 0
              }).execute()
              print("✅ DONE")
          except Exception as e:
              print("ERROR:", e)
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
