name: AI Ghost

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ghost
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests supabase
          python << EOF
          import requests, time, random, os, urllib.parse
          from supabase import create_client

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          supabase = create_client(url, key)

          # VARIETY POOLS
          subjects = ["female model", "male model", "fashion influencer", "royal figure", "cyberpunk character"]
          styles = ["haute couture gown", "arabic gold embroidery", "cyberpunk techwear", "minimalist suit", "streetwear drip", "chrome metal", "velvet cape"]
          poses = ["standing confidently", "walking on runway", "posing head to toe", "looking back", "sitting elegantly"]
          lighting = ["golden hour", "neon lights", "studio soft", "dramatic shadows", "sunset glow"]

          # Random selection for variety
          subject = random.choice(subjects)
          style = random.choice(styles)
          pose = random.choice(poses)
          light = random.choice(lighting)
          
          caption = f"{subject} in {style}"
          
          prompt = f"Ultra realistic full body fashion photo of {subject} wearing {style}, {pose}, {light} lighting, professional 8K"
          
          print(f"🎨 Generating: {caption}")
          print(f"📝 Prompt: {prompt}")

          encoded = urllib.parse.quote(prompt)
          img = f"https://image.pollinations.ai/prompt/{encoded}?width=800&height=1000&nologo=true&seed={random.randint(1,999999)}"

          r = requests.get(img, timeout=60)
          if r.status_code == 200:
              filename = f"post_{int(time.time())}_{random.randint(1,999)}.jpg"
              supabase.storage.from_("post-images").upload(filename, r.content)
              public = supabase.storage.from_("post-images").get_public_url(filename)
              public_url = public["publicUrl"] if isinstance(public, dict) else public
              
              supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": caption,
                  "is_ai": True,
                  "likes": 0
              }).execute()
              print(f"✅ Posted: {caption}")
          else:
              print(f"❌ Failed: {r.status_code}")
          EOF
