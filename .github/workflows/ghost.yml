name: AI Ghost - Test Version

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test Supabase Connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Step 1: Check if secrets exist"
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL is empty"; exit 1; else echo "SUPABASE_URL exists"; fi
          if [ -z "$SUPABASE_KEY" ]; then echo "SUPABASE_KEY is empty"; exit 1; else echo "SUPABASE_KEY exists"; fi
          
          echo "Step 2: Install Python packages"
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install supabase requests
          
          echo "Step 3: Run Python test"
          python3 << 'EOF'
          import requests, os, time, random
          from supabase import create_client
          
          print("Python script started")
          
          SUPABASE_URL = os.environ.get("SUPABASE_URL")
          SUPABASE_KEY = os.environ.get("SUPABASE_KEY")
          
          print(f"URL found: {SUPABASE_URL[:20]}...")
          print(f"Key found: {SUPABASE_KEY[:20]}...")
          
          try:
              print("Creating Supabase client...")
              supabase = create_client(SUPABASE_URL, SUPABASE_KEY)
              print("Client created successfully")
              
              print("Testing storage access...")
              buckets = supabase.storage.list_buckets()
              print(f"Buckets found: {buckets}")
              
              print("SUCCESS! Connection works.")
              
          except Exception as e:
              print(f"ERROR: {e}")
              import traceback
              traceback.print_exc()
              exit(1)
          EOF
          
          echo "Step 4: Done"
