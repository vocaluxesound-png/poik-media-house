name: AI Ghost - Visual Idea Engine

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Fashion Visual
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip3 install supabase requests
          python3 << 'EOF'
          import requests, os, time, random
          from supabase import create_client

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          supabase = create_client(SUPABASE_URL, SUPABASE_KEY)

          # Full body focused prompts
          subjects = [
              "female model full body", "male model full body standing",
              "fashion influencer full body walking", "royal figure full body elegant"
          ]
          
          styles = [
              "haute couture gown", "cyberpunk techwear", "minimalist luxury suit",
              "streetwear drip", "chrome liquid metal", "arabic gold embroidery"
          ]
          
          # Force full body in every prompt
          base_prompt = f"Ultra realistic full body shot, head to toe visible, {random.choice(subjects)} wearing {random.choice(styles)} fashion, standing pose, cinematic lighting, 8K, fashion photography, full frame, shoes visible"
          
          short_caption = f"{random.choice(['fashion influencer', 'model', 'royal figure'])} in {random.choice(styles)}"

          print(f"Generating: {base_prompt[:100]}...")

          encoded = base_prompt.replace(" ", "%20")
          seed = random.randint(1, 999999)
          img_url = f"https://image.pollinations.ai/prompt/{encoded}?width=1080&height=1920&nologo=true&seed={seed}&enhance=true"
          
          response = requests.get(img_url, timeout=90)

          if response.status_code == 200:
              filename = f"fashion_{int(time.time())}.jpg"
              supabase.storage.from_("post-images").upload(filename, response.content)
              public_url = supabase.storage.from_("post-images").get_public_url(filename)
              
              supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": short_caption,
                  "is_ai": True,
                  "likes": 0
              }).execute()
              print(f"✅ Posted: {short_caption}")
          else:
              print(f"❌ Failed: {response.status_code}")
          EOF
