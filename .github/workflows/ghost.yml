name: AI Ghost - Generate Every 10 Minutes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate and Post AI Image
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install supabase requests
          
          python3 << 'EOF'
          import requests, os, time, random
          from supabase import create_client
          
          SUPABASE_URL = os.environ.get("SUPABASE_URL")
          SUPABASE_KEY = os.environ.get("SUPABASE_KEY")
          
          print("Connecting to Supabase...")
          supabase = create_client(SUPABASE_URL, SUPABASE_KEY)
          
          # Use picsum.photos for reliable testing (always works)
          # Once this works, we can switch back to Pollinations
          print("Generating test image...")
          image_url = f"https://picsum.photos/1080/1920?random={random.randint(1,999999)}"
          response = requests.get(image_url, timeout=60)
          
          if response.status_code == 200:
              print("Image downloaded, uploading to Supabase...")
              filename = f"post_{int(time.time())}.jpg"
              
              # Upload to storage
              supabase.storage.from_("post-images").upload(filename, response.content)
              
              # Get public URL
              public_url = supabase.storage.from_("post-images").get_public_url(filename)
              print(f"Public URL: {public_url}")
              
              # Save to posts table
              result = supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": "AI Generated by Poik Ghost",
                  "is_ai": True,
                  "likes": 0
              }).execute()
              
              print(f"✅ Image posted successfully! Result: {result}")
          else:
              print(f"❌ Failed to download image: {response.status_code}")
          EOF
