name: AI Ghost - Debug

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip3 install supabase requests
          
          python3 << 'EOF'
          import requests, os, time, random
          from supabase import create_client
          
          try:
              print("Step 1: Getting secrets...")
              SUPABASE_URL = os.environ.get("SUPABASE_URL")
              SUPABASE_KEY = os.environ.get("SUPABASE_KEY")
              print(f"URL: {SUPABASE_URL[:30]}...")
              
              print("Step 2: Creating client...")
              supabase = create_client(SUPABASE_URL, SUPABASE_KEY)
              
              print("Step 3: Testing image download...")
              url = "https://picsum.photos/500/500"
              response = requests.get(url, timeout=30)
              print(f"Download status: {response.status_code}")
              print(f"Image size: {len(response.content)} bytes")
              
              print("Step 4: Testing upload to Supabase...")
              filename = f"test_{int(time.time())}.jpg"
              result = supabase.storage.from_("post-images").upload(filename, response.content)
              print(f"Upload result: {result}")
              
              print("Step 5: Getting public URL...")
              public_url = supabase.storage.from_("post-images").get_public_url(filename)
              print(f"URL: {public_url}")
              
              print("Step 6: Inserting into posts table...")
              insert = supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": "Test image",
                  "is_ai": True,
                  "likes": 0
              }).execute()
              print(f"Insert result: {insert}")
              
              print("✅ ALL STEPS PASSED!")
              
          except Exception as e:
              print(f"❌ ERROR: {e}")
              import traceback
              traceback.print_exc()
          EOF
