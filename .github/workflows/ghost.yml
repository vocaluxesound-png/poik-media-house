name: AI Ghost

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ghost
        run: |
          pip install requests supabase
          python << EOF
          import requests, time, random, os, urllib.parse
          from supabase import create_client

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          supabase = create_client(url, key)

          # Simple prompt
          prompt = "fashion model, full body, professional photography"
          encoded = urllib.parse.quote(prompt)
          img = f"https://image.pollinations.ai/prompt/{encoded}?width=800&height=1000&nologo=true"

          print("Downloading image...")
          r = requests.get(img, timeout=60)
          print(f"Status: {r.status_code}")

          if r.status_code == 200:
              filename = f"post_{int(time.time())}.jpg"
              
              # Upload to storage
              supabase.storage.from_("post-images").upload(filename, r.content)
              
              # FIXED: Get public URL correctly
              public_obj = supabase.storage.from_("post-images").get_public_url(filename)
              public_url = public_obj["publicUrl"] if isinstance(public_obj, dict) else public_obj
              
              print(f"Public URL: {public_url}")
              
              # Insert into database
              result = supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": "AI Fashion",
                  "is_ai": True,
                  "likes": 0
              }).execute()
              
              print(f"✅ Inserted successfully!")
          else:
              print(f"❌ Failed: {r.status_code}")
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
