name: AI Ghost

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ghost
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests supabase
          python << EOF
          import requests, time, random, os, urllib.parse
          from supabase import create_client

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          supabase = create_client(url, key)

          # Fashion pools
          subjects = ["female model", "male model", "fashion influencer", "royal figure"]
          styles = ["haute couture gown", "arabic gold embroidery", "cyberpunk techwear", "minimalist suit", "streetwear drip"]
          
          subject = random.choice(subjects)
          style = random.choice(styles)
          
          # Caption
          caption = f"{subject} in {style}"
          
          # Prompt with negative prompt to fix faces/hands
          prompt = f"Ultra realistic full body fashion photo of {subject} wearing {style}, sharp focus, perfect anatomy, natural skin texture, professional 8K"
          
          negative = "deformed face, bad hands, extra fingers, missing fingers, distorted body, unrealistic, blurry, cartoon, CGI, 3D render, plastic skin, doll, mannequin"
          
          full_prompt = f"{prompt} --no {negative}"
          
          print(f"Generating: {caption}")
          
          encoded = urllib.parse.quote(full_prompt)
          img = f"https://image.pollinations.ai/prompt/{encoded}?width=800&height=1000&nologo=true&seed={random.randint(1,999999)}"

          r = requests.get(img, timeout=60)
          if r.status_code == 200:
              filename = f"post_{int(time.time())}_{random.randint(1,999)}.jpg"
              supabase.storage.from_("post-images").upload(filename, r.content)
              public = supabase.storage.from_("post-images").get_public_url(filename)
              public_url = public["publicUrl"] if isinstance(public, dict) else public
              
              supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": caption,
                  "is_ai": True,
                  "likes": 0
              }).execute()
              print(f"Posted: {caption}")
          else:
              print(f"Failed: {r.status_code}")
          EOF
