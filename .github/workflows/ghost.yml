name: AI Ghost - Fashion Engine

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate and Post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip3 install supabase requests
          python3 << 'EOF'
          import requests, os, time, random
          from supabase import create_client

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          supabase = create_client(SUPABASE_URL, SUPABASE_KEY)

          # ============================================
          # FULL BODY FASHION POOLS
          # ============================================
          subjects = ["female model", "male model", "fashion influencer", "royal figure"]
          styles = ["haute couture gown", "arabic gold embroidery", "cyberpunk techwear", "minimalist luxury suit", "streetwear drip", "chrome liquid metal"]
          poses = ["standing confidently", "walking naturally", "posing head to toe", "looking back over shoulder"]
          environments = ["studio background", "city street", "runway", "modern interior"]
          
          subject = random.choice(subjects)
          style = random.choice(styles)
          pose = random.choice(poses)
          env = random.choice(environments)
          
          # Clean caption (remove "full body" junk)
          clean_subject = subject.replace("full body", "").strip()
          short_caption = f"{clean_subject} in {style}"
          
          # STRONG full body prompt
          prompt = f"""Ultra realistic full body fashion photography of {subject}, wearing {style}, {pose}, in {env}, entire body visible from head to toe, feet clearly visible, shoes included, standing naturally, centered framing, shot from a distance, no cropping, fashion magazine style, 8K, ultra detailed, sharp focus, cinematic lighting, full length shot, wide framing, subject fully in frame"""

          print(f"Generating: {prompt[:150]}...")
          print(f"Caption: {short_caption}")

          encoded = prompt.replace(" ", "%20")
          img_url = f"https://image.pollinations.ai/prompt/{encoded}?width=1080&height=1920&nologo=true"

          response = requests.get(img_url, timeout=90)

          if response.status_code == 200:
              filename = f"fashion_{int(time.time())}.jpg"
              
              # FIXED: Correct upload method
              supabase.storage.from_("post-images").upload(
                  path=filename,
                  file=response.content,
                  file_options={"content-type": "image/jpeg"}
              )
              
              # FIXED: Correct public URL extraction
              public_url = supabase.storage.from_("post-images").get_public_url(filename)["publicUrl"]
              
              supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": short_caption,
                  "is_ai": True,
                  "likes": 0
              }).execute()
              print(f"✅ Posted: {short_caption}")
              print(f"🔗 URL: {public_url}")
          else:
              print(f"❌ Failed: {response.status_code}")
          EOF
