name: AI Ghost - Supabase Test

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test Supabase Connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip3 install supabase requests --quiet
          
          python3 << 'EOF'
          import os
          from supabase import create_client
          
          print("Testing Supabase connection...")
          
          SUPABASE_URL = os.environ.get("SUPABASE_URL")
          SUPABASE_KEY = os.environ.get("SUPABASE_KEY")
          
          supabase = create_client(SUPABASE_URL, SUPABASE_KEY)
          
          # Test listing buckets
          buckets = supabase.storage.list_buckets()
          print(f"✅ Connected! Found buckets: {[b['name'] for b in buckets]}")
          
          # Test getting posts
          posts = supabase.table("posts").select("*").limit(1).execute()
          print(f"✅ Posts table accessible. Found {len(posts.data)} posts.")
          
          print("All tests passed!")
          EOF
