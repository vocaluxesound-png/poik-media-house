name: AI Ghost - Fashion Engine

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate and Post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip3 install supabase requests
          python3 << 'EOF'
          import requests, os, time, random, urllib.parse

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          
          from supabase import create_client
          supabase = create_client(SUPABASE_URL, SUPABASE_KEY)

          subjects = ["female model", "male model", "fashion influencer", "royal figure"]
          styles = ["haute couture gown", "arabic gold embroidery", "cyberpunk techwear", "minimalist luxury suit", "streetwear drip", "chrome liquid metal"]
          
          subject = random.choice(subjects)
          style = random.choice(styles)
          short_caption = f"{subject} in {style}"
          
          prompt = f"Ultra realistic full body fashion photo of {subject} wearing {style}, standing, head to toe visible, shoes visible, 8K, cinematic lighting, fashion magazine"
          
          print(f"Generating: {prompt[:100]}...")
          print(f"Caption: {short_caption}")

          # URL encode properly
          encoded = urllib.parse.quote(prompt)
          img_url = f"https://image.pollinations.ai/prompt/{encoded}?width=1080&height=1920&nologo=true"

          try:
              response = requests.get(img_url, timeout=90)
              print(f"API Status: {response.status_code}")
              
              if response.status_code != 200:
                  print(f"❌ API error: {response.status_code}")
                  exit(1)
                  
              filename = f"fashion_{int(time.time())}.jpg"
              
              # Upload to Supabase
              supabase.storage.from_("post-images").upload(filename, response.content)
              
              # Get public URL
              public_url = supabase.storage.from_("post-images").get_public_url(filename)
              
              # Insert into database
              supabase.table("posts").insert({
                  "image_url": public_url,
                  "caption": short_caption,
                  "is_ai": True,
                  "likes": 0
              }).execute()
              
              print(f"✅ Posted: {short_caption}")
              
          except Exception as e:
              print(f"❌ Error: {e}")
              exit(1)
          EOF
