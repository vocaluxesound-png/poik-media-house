<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Poik Poik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="header">
<div class="header-content">
<div class="logo">POIK POIK</div>
<div class="header-icons">
<i class="fas fa-search" onclick="openSearchModal()" style="cursor: pointer;"></i>
<i class="fas fa-sign-out-alt" onclick="logout()" style="color: #ff4444; cursor: pointer;" title="Logout"></i>
<div id="headerAvatar" class="header-avatar" onclick="openAuthModal()" style="cursor: pointer; width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; overflow: hidden;">
<i class="fas fa-user" style="color: white;"></i>
</div>
</div>
</div>
</div>

<div class="top-nav">
<button class="nav-item active" onclick="switchTab('feed')">Feed</button>
<button class="nav-item" onclick="switchTab('explore')">Explore</button>
<button class="nav-item" onclick="switchTab('following')">Following</button>
</div>

<div id="feed" class="feed"><div class="loading">Loading...</div></div>

<!-- Search Modal -->
<div id="searchModal" class="search-modal" style="display: none;">
<div class="search-modal-content">
<div class="search-header">
<i class="fas fa-search"></i>
<input type="text" id="searchInput" placeholder="Search users, posts..." autocomplete="off">
<i class="fas fa-times" onclick="closeSearchModal()" style="cursor: pointer;"></i>
</div>
<div id="searchResults" class="search-results"></div>
</div>
</div>

<div class="bottom-nav">
<div class="bottom-nav-items">
<button class="bottom-nav-item active" onclick="bottomNav('home')"><i class="fas fa-home"></i><span>Home</span></button>
<button class="bottom-nav-item" onclick="bottomNav('friends')"><i class="fas fa-user-friends"></i><span>Friends</span></button>
<div class="plus-circle" onclick="openUploadModal()"><i class="fas fa-plus"></i></div>
<button class="bottom-nav-item" onclick="bottomNav('inbox')"><i class="far fa-comment-dots"></i><span>Inbox</span></button>
<button class="bottom-nav-item" onclick="bottomNav('profile')"><i class="far fa-user"></i><span>Profile</span></button>
</div>
</div>

<div id="uploadModal" class="upload-modal">
<h3>Upload</h3>
<input type="file" id="uploadFile" accept="image/*">
<input type="text" id="uploadCaption" placeholder="Caption...">
<select id="uploadPrivacy" class="privacy-select">
<option value="public">🌍 Public</option>
<option value="friends">👥 Friends Only</option>
<option value="private">🔒 Only Me</option>
</select>
<button onclick="uploadPost()">Post</button>
<button onclick="closeUploadModal()" style="background:#444;">Cancel</button>
</div>

<div id="shareModal" class="share-modal">
<h3 style="text-align:center;">Share to</h3>
<div class="share-options">
<div class="share-option" onclick="shareTo('facebook')"><i class="fab fa-facebook-f" style="color:#1877f2;"></i><span>Facebook</span></div>
<div class="share-option" onclick="shareTo('whatsapp')"><i class="fab fa-whatsapp" style="color:#25D366;"></i><span>WhatsApp</span></div>
<div class="share-option" onclick="shareTo('twitter')"><i class="fab fa-twitter" style="color:#1DA1F2;"></i><span>Twitter</span></div>
<div class="share-option" onclick="shareTo('instagram')"><i class="fab fa-instagram" style="color:#E4405F;"></i><span>Instagram</span></div>
<div class="share-option" onclick="copyLink()"><i class="fas fa-link"></i><span>Copy Link</span></div>
</div>
<button onclick="closeShareModal()" style="width:100%; padding:12px; margin-top:15px; background:#333; border:none; border-radius:30px; color:white;">Cancel</button>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
<span class="close-modal" onclick="closeModal()">&times;</span>
<img id="modalImage">
</div>

<div id="authModal" class="auth-modal">
<div class="auth-box">
<h3 style="margin-bottom:20px;">Join Poik Poik</h3>
<p style="font-size:14px; color:#888; margin-bottom:15px;">Enter your email to receive a one-time password</p>
<input type="email" id="authEmail" placeholder="Email">
<button id="magicLoginBtn" class="magic-btn">Send One-time password</button>
<button id="closeAuthBtn" class="cancel-btn">Cancel</button>
</div>
</div>

<div id="editProfileModal" class="edit-profile-modal">
<div class="edit-profile-box">
<h3 style="margin-bottom:20px;">Edit Profile</h3>
<input type="text" id="editUsername" placeholder="Username">
<textarea id="editBio" rows="3" placeholder="Bio / Description (short)"></textarea>
<button id="saveProfileBtn" class="save-profile-btn">Save Changes</button>
<button id="closeEditModal" class="cancel-edit-btn">Cancel</button>
</div>
</div>

<input type="file" id="avatarInput" accept="image/*">

<script src="auth.js"></script>
<script src="profile.js"></script>
<script src="comments.js"></script>
<script src="feed.js"></script>
<script src="friends.js"></script>
<script src="search.js"></script>

<script>
async function initStorage() { try { await SB.storage.createBucket('avatars', { public: true }); } catch(e) {} }
initStorage();

// Handle magic link from URL
handleMagicLink();

// Restore session or check auth
(async function() {
    const sessionRestored = await restoreSession();
    if (!sessionRestored) {
        await checkAuth();
    }
    if (typeof loadFeed === 'function') {
        loadFeed();
    }
})();
</script>
</body>
</html>
