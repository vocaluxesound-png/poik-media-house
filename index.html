<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poik Poik | AI Media House</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; color: white; font-family: system-ui; }
        .feed { max-width: 600px; margin: auto; padding: 20px; }
        .post {
            background: #111;
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }
        .post img {
            width: 100%;
            display: block;
        }
        .post-caption {
            padding: 12px;
            font-size: 14px;
            color: #ccc;
        }
        .header {
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #222;
            margin-bottom: 10px;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #00ff88;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 12px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚡ POIK POIK</div>
    </div>
    <div class="feed" id="feed">
        <div class="loading">Loading stunning fashion...</div>
    </div>
    <footer>⚡ New AI fashion visual every 10 minutes</footer>

    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modalImage" src="">
    </div>

    <script>
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function openModal(imageUrl) {
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = '<div class="loading">Loading stunning fashion...</div>';
            
            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                feedDiv.innerHTML = '<div class="loading">Error loading feed. Please refresh.</div>';
                return;
            }
            
            if (!data || data.length === 0) {
                feedDiv.innerHTML = '<div class="loading">No posts yet. AI Ghost is creating fashion visuals...</div>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < data.length; i++) {
                const post = data[i];
                let caption = post.caption || '';
                // Remove any "AI Ghost" prefix if present
                caption = caption.replace(/^AI Ghost\s*[•\-]?\s*/, '');
                html += `
                    <div class="post" onclick="openModal('${post.image_url}')">
                        <img src="${post.image_url}" loading="lazy">
                        <div class="post-caption">${caption}</div>
                    </div>
                `;
            }
            feedDiv.innerHTML = html;
        }
        
        loadFeed();
        setInterval(loadFeed, 30000);
        
        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
