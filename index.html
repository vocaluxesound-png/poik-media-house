<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poik Poik</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; color: white; font-family: system-ui; }
        .header { padding: 15px; text-align: center; border-bottom: 1px solid #222; }
        .logo { font-size: 28px; font-weight: bold; }
        .logo span { color: #00ff88; }
        .feed { max-width: 500px; margin: auto; }
        .post { margin-bottom: 20px; background: #111; }
        .post img { width: 100%; display: block; }
        .post-info { padding: 10px; }
        .loading { text-align: center; padding: 50px; color: #666; }
        footer { text-align: center; padding: 20px; color: #444; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">POIK<span>POIK</span></div>
        <div style="font-size: 12px; color: #888;">AI Media House</div>
    </div>
    <div class="feed" id="feed">
        <div class="loading">Loading...</div>
    </div>
    <footer>⚡ New AI image every 10 minutes</footer>

    <script>
        // YOUR SUPABASE CREDENTIALS
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            
            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                feedDiv.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
                return;
            }
            
            if (!data || data.length === 0) {
                feedDiv.innerHTML = '<div class="loading">No posts yet. Ghost is waking up...</div>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < data.length; i++) {
                const post = data[i];
                html += `
                    <div class="post">
                        <img src="${post.image_url}" alt="Post">
                        <div class="post-info">
                            ${post.is_ai ? '🤖 AI Ghost' : '👤 User'} • ${post.caption || ''}
                        </div>
                    </div>
                `;
            }
            feedDiv.innerHTML = html;
        }
        
        loadFeed();
        
        // Reload every 30 seconds
        setInterval(loadFeed, 30000);
    </script>
</body>
</html>
