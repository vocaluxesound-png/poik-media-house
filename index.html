<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poik Poik</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background:black; color:white; font-family:system-ui; margin:0; }
        .logo { text-align:center; font-size:28px; font-weight:bold; padding:20px; }
        .feed { max-width:600px; margin:auto; }
        .post { background:#111; margin-bottom:20px; border-radius:16px; overflow:hidden; }
        .post img { width:100%; }
        .caption { padding:10px; }
        .actions { display:flex; justify-content:space-between; padding:10px; }
        button { background:#222; color:white; border:none; padding:6px 10px; border-radius:8px; cursor:pointer; }
        input { width:70%; padding:5px; }
    </style>
</head>
<body>
    <div class="logo">
        <span style="color:#00ff88;">POIK</span><span>POIK</span>
    </div>
    <div style="text-align:center">
        <button onclick="login()">Login</button>
        <button onclick="logout()">Logout</button>
        <input type="file" id="uploadFile">
        <button onclick="upload()">Upload</button>
    </div>
    <div id="feed" class="feed">Loading...</div>

    <script>
        const supabase = window.supabase.createClient(
            "https://xxnuhisweolpibzthjcc.supabase.co",
            "sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P"
        );

        async function load(){
            const { data, error } = await supabase.from("posts").select("*").order("id",{ascending:false});
            const feed = document.getElementById("feed");
            if(error){ feed.innerHTML="Error"; return; }
            if(!data || data.length===0){ feed.innerHTML="No posts"; return; }
            let html="";
            data.forEach(p=>{
                html+=`
                    <div class="post">
                        <img src="${p.image_url}" onerror="this.remove()">
                        <div class="actions">
                            <button onclick="like(${p.id})">❤️</button>
                            <button onclick="share('${p.image_url}')">🔗</button>
                            <button onclick="del(${p.id})">🗑️</button>
                        </div>
                        <div class="caption">${p.caption||""}</div>
                        <div>
                            <input id="c${p.id}" placeholder="comment...">
                            <button onclick="comment(${p.id})">Send</button>
                        </div>
                    </div>
                `;
            });
            feed.innerHTML=html;
        }
        load();

        async function like(id){
            await supabase.from("likes").insert({post_id:id});
            alert("Liked");
        }

        async function comment(id){
            const text=document.getElementById("c"+id).value;
            await supabase.from("comments").insert({post_id:id,text});
            alert("Comment added");
        }

        async function del(id){
            await supabase.from("posts").delete().eq("id",id);
            load();
        }

        function share(url){
            navigator.clipboard.writeText(url);
            alert("Copied!");
        }

        async function login(){
            await supabase.auth.signInWithOtp({email:prompt("Email")});
        }

        async function logout(){
            await supabase.auth.signOut();
        }

        async function upload(){
            const file=document.getElementById("uploadFile").files[0];
            if(!file) return;
            const name=Date.now()+"_"+file.name;
            await supabase.storage.from("post-images").upload(name,file);
            const pub=supabase.storage.from("post-images").get_public_url(name);
            await supabase.from("posts").insert({
                image_url: pub.publicUrl,
                caption: "User upload"
            });
            load();
        }

        setInterval(load,15000);
    </script>
</body>
</html>
