<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poik Poik</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; color: white; font-family: system-ui; padding-bottom: 80px; }
        
        .header {
            position: sticky;
            top: 0;
            background: black;
            border-bottom: 1px solid #222;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-icons { display: flex; gap: 20px; font-size: 22px; cursor: pointer; }
        .nav-icons i:hover { color: #00ff88; }
        
        .feed { max-width: 600px; margin: 0 auto; }
        
        .post {
            margin-bottom: 20px;
            background: #0a0a0a;
            border-radius: 16px;
            overflow: hidden;
        }
        .post-header {
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .username { font-weight: bold; font-size: 14px; flex: 1; }
        .delete-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 16px;
        }
        .post-img {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
        .caption {
            padding: 12px;
            font-size: 14px;
            text-align: center;
        }
        .post-actions {
            padding: 8px 12px;
            display: flex;
            gap: 20px;
            border-top: 1px solid #222;
        }
        .action-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn:hover { color: #00ff88; }
        
        .comments-section {
            padding: 12px;
            background: #060606;
            border-top: 1px solid #222;
        }
        .comment {
            font-size: 13px;
            padding: 6px 0;
            display: flex;
            gap: 8px;
        }
        .comment-input {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .comment-input input {
            flex: 1;
            padding: 10px;
            border-radius: 24px;
            border: 1px solid #333;
            background: #111;
            color: white;
        }
        .comment-input button {
            padding: 8px 16px;
            border-radius: 24px;
            border: none;
            background: #00ff88;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        
        .upload-area {
            max-width: 600px;
            margin: 20px auto;
            padding: 16px;
            background: #0a0a0a;
            border-radius: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .upload-area input {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            border: 1px solid #333;
            background: #111;
            color: white;
        }
        .upload-area button {
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            background: #00ff88;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        
        .loading { text-align: center; padding: 50px; color: #666; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal img { max-width: 100%; max-height: 100%; }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
        
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .auth-box {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span style="color: #00ff88;">POIK</span><span style="color: white;">POIK</span>
        </div>
        <div class="nav-icons">
            <i class="fas fa-plus" id="uploadIcon"></i>
            <i class="far fa-user-circle" id="userIcon"></i>
        </div>
    </div>

    <div id="uploadArea" style="display:none;" class="upload-area">
        <input type="file" id="uploadFile" accept="image/*">
        <input type="text" id="uploadCaption" placeholder="Caption">
        <button onclick="uploadPost()">Post</button>
    </div>

    <div class="feed" id="feed">
        <div class="loading">Loading...</div>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img id="modalImage">
    </div>

    <div id="authModal" class="auth-modal">
        <div class="auth-box">
            <h3>Join Poik Poik</h3>
            <input type="email" id="authEmail" placeholder="Email">
            <input type="password" id="authPassword" placeholder="Password">
            <button id="authButton">Login / Sign Up</button>
            <button id="closeAuth" style="background:#333;">Cancel</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            currentUser = user;
            const uploadArea = document.getElementById('uploadArea');
            const userIcon = document.getElementById('userIcon');
            if (user) {
                uploadArea.style.display = 'flex';
                userIcon.classList.remove('far');
                userIcon.classList.add('fas');
            } else {
                uploadArea.style.display = 'none';
                userIcon.classList.remove('fas');
                userIcon.classList.add('far');
            }
        }

        document.getElementById('userIcon').onclick = () => document.getElementById('authModal').style.display = 'flex';
        document.getElementById('closeAuth').onclick = () => document.getElementById('authModal').style.display = 'none';
        document.getElementById('uploadIcon').onclick = () => {
            if (currentUser) document.getElementById('uploadArea').style.display = 'flex';
            else alert('Login to upload');
        };

        document.getElementById('authButton').onclick = async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            let { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                let { error: signUpError } = await supabase.auth.signUp({ email, password });
                if (signUpError) alert('Error: ' + signUpError.message);
                else alert('Account created! Check your email.');
            } else alert('Welcome back!');
            document.getElementById('authModal').style.display = 'none';
            checkUser();
            loadFeed();
        };

        async function uploadPost() {
            if (!currentUser) { alert('Login first'); return; }
            const file = document.getElementById('uploadFile').files[0];
            const caption = document.getElementById('uploadCaption').value;
            if (!file) { alert('Select an image'); return; }
            
            const fileName = `${currentUser.id}_${Date.now()}.jpg`;
            await supabase.storage.from('post-images').upload(fileName, file);
            const { data } = supabase.storage.from('post-images').getPublicUrl(fileName);
            
            await supabase.from('posts').insert({
                image_url: data.publicUrl,
                caption: caption,
                user_id: currentUser.id,
                is_ai: false,
                likes: 0
            });
            alert('Posted!');
            document.getElementById('uploadFile').value = '';
            document.getElementById('uploadCaption').value = '';
            loadFeed();
        }

        async function likePost(postId) {
            if (!currentUser) { alert('Login to like'); return; }
            const { data: existing } = await supabase.from('likes').select().eq('post_id', postId).eq('user_id', currentUser.id);
            if (existing.length > 0) {
                await supabase.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
                await supabase.rpc('decrement_likes', { post_id: postId });
            } else {
                await supabase.from('likes').insert({ post_id: postId, user_id: currentUser.id });
                await supabase.rpc('increment_likes', { post_id: postId });
            }
            loadFeed();
        }

        async function deletePost(postId, userId) {
            if (!currentUser) return;
            if (currentUser.id === userId) {
                if (confirm('Delete this post?')) {
                    await supabase.from('posts').delete().eq('id', postId);
                    loadFeed();
                }
            } else {
                alert('You can only delete your own posts');
            }
        }

        async function addComment(postId) {
            if (!currentUser) { alert('Login to comment'); return; }
            const input = document.getElementById(`comment-input-${postId}`);
            if (input.value.trim()) {
                await supabase.from('comments').insert({
                    post_id: postId,
                    user_id: currentUser.id,
                    content: input.value
                });
                input.value = '';
                loadFeed();
            }
        }

        function toggleComments(postId) {
            const section = document.getElementById(`comments-${postId}`);
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        function openModal(img) {
            document.getElementById('modalImage').src = img;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = '<div class="loading">Loading stunning visuals...</div>';
            
            let query = supabase.from('posts').select('*').order('id', { ascending: false });
            const { data, error } = await query;
            
            if (error) {
                feedDiv.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                feedDiv.innerHTML = '<div class="loading">No posts yet. AI Ghost is creating...</div>';
                return;
            }
            
            let html = '';
            for (const post of data) {
                const { count: likeCount } = await supabase.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', post.id);
                const { data: comments } = await supabase.from('comments').select('*').eq('post_id', post.id).order('created_at');
                const isOwner = currentUser && currentUser.id === post.user_id;
                let caption = post.caption || 'Fashion visual';
                
                html += `
                    <div class="post">
                        <div class="post-header">
                            <div class="avatar">${post.is_ai ? '🤖' : '👤'}</div>
                            <div class="username">${post.is_ai ? 'Poik Ghost' : 'Member'}</div>
                            ${isOwner ? `<button class="delete-btn" onclick="deletePost(${post.id}, '${post.user_id}')">🗑️</button>` : ''}
                        </div>
                        <img class="post-img" src="${post.image_url}" onclick="openModal('${post.image_url}')" loading="lazy">
                        <div class="caption">${caption}</div>
                        <div class="post-actions">
                            <button class="action-btn" onclick="likePost(${post.id})">❤️ ${likeCount || 0}</button>
                            <button class="action-btn" onclick="toggleComments(${post.id})">💬 ${comments?.length || 0}</button>
                            <button class="action-btn" onclick="navigator.clipboard.writeText('${post.image_url}'); alert('Image link copied!')">📤</button>
                        </div>
                        <div class="comments-section" id="comments-${post.id}" style="display:none">
                            ${comments?.map(c => `<div class="comment">💬 ${c.content}</div>`).join('') || '<div>No comments yet</div>'}
                            <div class="comment-input">
                                <input type="text" id="comment-input-${post.id}" placeholder="Write a comment...">
                                <button onclick="addComment(${post.id})">Post</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            feedDiv.innerHTML = html;
        }

        checkUser();
        loadFeed();
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
