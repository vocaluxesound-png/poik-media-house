<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- GLOBAL STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px; /* Space for future mobile nav */
        }
        
        /* --- STICKY HEADER WITH YOUR LOGO STYLE --- */
        .header {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
            padding: 12px 16px;
            z-index: 100;
        }
        .header-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* Your exact logo style: half white, half green */
        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF 50%, #00ff88 50%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-icons {
            display: flex;
            gap: 20px;
            font-size: 22px;
            color: #fff;
            cursor: pointer;
        }
        .nav-icons i:hover { color: #00ff88; transition: 0.2s; }
        
        /* --- FEED LAYOUT (CENTERED, LARGE IMAGES) --- */
        .feed {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 0 20px 0;
        }
        .post {
            margin-bottom: 25px;
            background: #0a0a0a;
            border-radius: 16px;
            overflow: hidden;
        }
        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #0066ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }
        .username {
            font-weight: 600;
            font-size: 15px;
        }
        .post-img {
            width: 100%;
            max-height: 750px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .post-img:active { transform: scale(1.02); }
        .post-actions {
            padding: 10px 16px;
            display: flex;
            gap: 20px;
            font-size: 24px;
            cursor: pointer;
        }
        .post-actions i:active { transform: scale(1.1); }
        .caption-text {
            padding: 0 16px 12px;
            font-size: 14px;
        }
        
        /* --- FULLSCREEN MODAL (FOR TAP TO VIEW) --- */
        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .fullscreen-modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
        }
        .loading { text-align: center; padding: 50px; color: #888; }
    </style>
</head>
<body>

    <!-- YOUR NEW HEADER -->
    <div class="header">
        <div class="header-content">
            <div class="logo">POIK<span style="color:#00ff88; background:none;">POIK</span></div>
            <div class="nav-icons">
                <i class="fas fa-search"></i>
                <i class="far fa-heart"></i>
                <i class="far fa-user-circle"></i>
            </div>
        </div>
    </div>

    <!-- THE FEED (SAME CORE LOGIC) -->
    <div class="feed" id="feed">
        <div class="loading">Loading stunning visuals...</div>
    </div>

    <!-- FULLSCREEN MODAL (SINGLE TAP) -->
    <div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreen()">
        <span class="close-btn" onclick="closeFullscreen()">&times;</span>
        <img id="fullscreenImage" src="">
    </div>

    <script>
        // Supabase config (same as yours)
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Fullscreen handlers
        function openFullscreen(imageUrl) {
            document.getElementById('fullscreenImage').src = imageUrl;
            document.getElementById('fullscreenModal').style.display = 'flex';
        }
        function closeFullscreen() {
            document.getElementById('fullscreenModal').style.display = 'none';
        }
        
        // Load posts (same as before)
        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = '<div class="loading">⚡ Loading stunning visuals...</div>';
            
            try {
                const { data, error } = await _supabase
                    .from('posts')
                    .select('*')
                    .order('id', { ascending: false });
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    feedDiv.innerHTML = '<div class="loading">✨ No posts yet. Ghost is creating...</div>';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < data.length; i++) {
                    const post = data[i];
                    html += `
                        <div class="post">
                            <div class="post-header">
                                <div class="avatar">✨</div>
                                <div class="username">Poik Poik</div>
                            </div>
                            <img class="post-img" src="${post.image_url}" onclick="openFullscreen('${post.image_url}')" loading="lazy">
                            <div class="post-actions">
                                <i class="far fa-heart"></i>
                                <i class="far fa-comment"></i>
                                <i class="far fa-paper-plane"></i>
                            </div>
                            <div class="caption-text">${post.caption || "Fashion visual"} <span style="color:#888;">❤️ ${post.likes || 0} likes</span></div>
                        </div>
                    `;
                }
                feedDiv.innerHTML = html;
            } catch (err) {
                feedDiv.innerHTML = '<div class="loading">⚠️ Error loading feed. Refresh?</div>';
                console.error(err);
            }
        }
        
        loadFeed();
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFullscreen(); });
    </script>
</body>
</html>
