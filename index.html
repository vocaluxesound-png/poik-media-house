<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poik Poik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; color: white; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding-bottom: 70px; }
    
    .header {
        position: sticky;
        top: 0;
        background: rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
        padding: 12px 16px;
        z-index: 100;
        border-bottom: 1px solid #222;
    }
    .header-content { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #00ff88 40%, #ffffff 60%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .header-icons { display: flex; gap: 16px; align-items: center; }
    .header-icons i { font-size: 22px; cursor: pointer; color: #ccc; }
    
    .top-nav { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-around; padding: 12px 16px; position: sticky; top: 60px; background: transparent; z-index: 99; }
    .nav-item { background: none; border: none; color: #aaa; font-size: 15px; font-weight: 600; padding: 8px 16px; cursor: pointer; position: relative; }
    .nav-item:hover { color: white; }
    .nav-item.active { color: white; }
    .nav-item.active::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 30px; height: 2px; background-color: #00ff88; border-radius: 2px; }
    
    .feed { max-width: 600px; margin: 0 auto; padding-bottom: 20px; }
    .post { background: #0a0a0a; margin-bottom: 20px; border-radius: 16px; overflow: hidden; position: relative; }
    .post-header { padding: 12px; display: flex; align-items: center; justify-content: space-between; }
    .post-header-left { display: flex; align-items: center; gap: 10px; }
    
    /* M Logo - 4 green triangles forming M */
    .m-logo {
        width: 40px;
        height: 40px;
        background: black;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 2px;
        padding: 5px 3px;
        border-radius: 8px;
    }
    .tri {
        width: 7px;
        background: #00ff88;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }
    .tri1 { height: 14px; }
    .tri2 { height: 24px; }
    .tri3 { height: 28px; }
    .tri4 { height: 18px; }
    
    .post-username { font-weight: 600; font-size: 14px; }
    .post-image { width: 100%; display: block; cursor: pointer; }
    .post-caption { padding: 12px; font-size: 14px; padding-right: 70px; }
    
    .post-actions-right {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 16px;
        z-index: 10;
    }
    @media (max-width: 640px) { .post-actions-right { right: 10px; gap: 14px; } }
    @media (min-width: 641px) { .post-actions-right { right: 16px; gap: 18px; } }
    
    .action-icon { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .action-icon i { font-size: 24px; color: white; text-shadow: 0 0 5px rgba(0,0,0,0.5); transition: transform 0.2s; }
    .action-icon span { font-size: 11px; color: #ddd; }
    .action-icon:hover i { color: #ff4444; transform: scale(1.1); }
    
    /* Privacy Badge */
    .privacy-badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        margin-left: 8px;
    }
    .privacy-public { background: #00ff88; color: black; }
    .privacy-friends { background: #ffaa00; color: black; }
    .privacy-private { background: #ff4444; color: white; }
    
    .delete-btn {
        background: none;
        border: none;
        color: #ff4444;
        cursor: pointer;
        font-size: 14px;
        margin-left: 10px;
    }
    .delete-btn:hover { color: #ff8888; }
    
    .share-modal {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1a1a1a;
        border-radius: 20px 20px 0 0;
        padding: 20px;
        z-index: 200;
        animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .share-options { display: flex; justify-content: space-around; margin-top: 20px; flex-wrap: wrap; gap: 15px; }
    .share-option { text-align: center; cursor: pointer; padding: 10px; border-radius: 12px; min-width: 70px; }
    .share-option i { font-size: 30px; display: block; }
    .share-option span { font-size: 12px; margin-top: 5px; color: #ccc; }
    .share-option:hover { background: #333; }
    
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.95);
        backdrop-filter: blur(10px);
        border-top: 1px solid #222;
        padding: 8px 20px;
        z-index: 100;
    }
    .bottom-nav-items { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; }
    .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #888; cursor: pointer; }
    .bottom-nav-item i { font-size: 22px; }
    .bottom-nav-item span { font-size: 10px; }
    .bottom-nav-item.active { color: #00ff88; }
    .bottom-nav-item:hover { color: #ccc; }
    .plus-circle { background: white; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; margin-top: -20px; cursor: pointer; }
    .plus-circle i { color: black; font-size: 24px; }
    
    .comments-section { padding: 12px; background: #060606; }
    .comment { font-size: 13px; padding: 8px 0; border-bottom: 1px solid #1a1a1a; }
    .comment strong { color: #00ff88; }
    .comment-input { display: flex; gap: 8px; margin-top: 12px; }
    .comment-input input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #222; color: white; }
    .comment-input button { padding: 8px 16px; border-radius: 20px; border: none; background: #00ff88; color: black; font-weight: bold; cursor: pointer; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 1000; justify-content: center; align-items: center; }
    .modal img { max-width: 100%; max-height: 100%; }
    .close-modal { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer; }
    
    .upload-modal {
        display: none;
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: #1a1a1a;
        padding: 20px;
        border-radius: 20px;
        z-index: 200;
        width: 90%;
        max-width: 350px;
        text-align: center;
    }
    .upload-modal .privacy-select {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 10px;
        background: #333;
        color: white;
        border: none;
    }
    .upload-modal input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 10px; border: none; background: #333; color: white; }
    .upload-modal button { background: #00ff88; color: black; border: none; padding: 10px 16px; border-radius: 30px; font-weight: bold; cursor: pointer; margin: 5px; }
    
    .loading { text-align: center; padding: 50px; color: #888; }
    
    .profile-header { text-align: center; padding: 30px 20px; }
    .profile-avatar { 
        width: 80px; 
        height: 80px; 
        border-radius: 50%; 
        background: #333; 
        margin: 0 auto 15px; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 40px;
        cursor: pointer;
        overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-stats { display: flex; justify-content: center; gap: 30px; margin: 15px 0; }
    .profile-bio { color: #888; font-size: 14px; margin: 10px 0; }
    .edit-profile-btn { background: #333; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; margin-top: 10px; }
    
    .auth-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        z-index: 200;
        align-items: center;
        justify-content: center;
    }
    .auth-box {
        background: #111;
        padding: 30px;
        border-radius: 20px;
        width: 90%;
        max-width: 350px;
        text-align: center;
    }
    .auth-box input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        background: #222;
        border: 1px solid #333;
        border-radius: 10px;
        color: white;
    }
    .auth-box button {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }
    .magic-btn { background: #00ff88; color: black; border: none; }
    .logout-btn { background: #ff4444; color: white; border: none; }
    .cancel-btn { background: #222; color: white; border: none; }
    
    /* Profile upload input hidden */
    #profileUpload { display: none; }
</style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <div class="logo">POIK POIK</div>
        <div class="header-icons">
            <i class="fas fa-plus" onclick="openUploadModal()"></i>
            <div style="display: flex; gap: 10px; align-items: center;">
                <i class="fas fa-sign-out-alt" onclick="logout()" style="color: #ff4444;" title="Logout"></i>
                <i class="far fa-user-circle" onclick="openAuthModal()"></i>
            </div>
        </div>
    </div>
</div>

<div class="top-nav">
    <button class="nav-item active" onclick="switchTab('feed')">Feed</button>
    <button class="nav-item" onclick="switchTab('explore')">Explore</button>
    <button class="nav-item" onclick="switchTab('following')">Following</button>
</div>

<div id="feed" class="feed"><div class="loading">Loading...</div></div>

<div class="bottom-nav">
    <div class="bottom-nav-items">
        <button class="bottom-nav-item active" onclick="bottomNav('home')"><i class="fas fa-home"></i><span>Home</span></button>
        <button class="bottom-nav-item" onclick="bottomNav('friends')"><i class="fas fa-user-friends"></i><span>Friends</span></button>
        <div class="plus-circle" onclick="openUploadModal()"><i class="fas fa-plus"></i></div>
        <button class="bottom-nav-item" onclick="bottomNav('inbox')"><i class="far fa-comment-dots"></i><span>Inbox</span></button>
        <button class="bottom-nav-item" onclick="bottomNav('profile')"><i class="far fa-user"></i><span>Profile</span></button>
    </div>
</div>

<div id="uploadModal" class="upload-modal">
    <h3>Upload</h3>
    <input type="file" id="uploadFile" accept="image/*">
    <input type="text" id="uploadCaption" placeholder="Caption...">
    <select id="uploadPrivacy" class="privacy-select">
        <option value="public">🌍 Public</option>
        <option value="friends">👥 Friends Only</option>
        <option value="private">🔒 Private</option>
    </select>
    <button onclick="uploadPost()">Post</button>
    <button onclick="closeUploadModal()" style="background:#444;">Cancel</button>
</div>

<div id="shareModal" class="share-modal">
    <h3 style="text-align:center;">Share to</h3>
    <div class="share-options">
        <div class="share-option" onclick="shareTo('facebook')"><i class="fab fa-facebook-f" style="color:#1877f2;"></i><span>Facebook</span></div>
        <div class="share-option" onclick="shareTo('whatsapp')"><i class="fab fa-whatsapp" style="color:#25D366;"></i><span>WhatsApp</span></div>
        <div class="share-option" onclick="shareTo('twitter')"><i class="fab fa-twitter" style="color:#1DA1F2;"></i><span>Twitter</span></div>
        <div class="share-option" onclick="shareTo('instagram')"><i class="fab fa-instagram" style="color:#E4405F;"></i><span>Instagram</span></div>
        <div class="share-option" onclick="copyLink()"><i class="fas fa-link"></i><span>Copy Link</span></div>
    </div>
    <button onclick="closeShareModal()" style="width:100%; padding:12px; margin-top:15px; background:#333; border:none; border-radius:30px; color:white;">Cancel</button>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img id="modalImage">
</div>

<div id="authModal" class="auth-modal">
    <div class="auth-box">
        <h3 style="margin-bottom:20px;">Join Poik Poik</h3>
        <p style="font-size:14px; color:#888; margin-bottom:15px;">Enter your email to receive a magic login link</p>
        <input type="email" id="authEmail" placeholder="Email">
        <button id="magicLoginBtn" class="magic-btn">Send Magic Link</button>
        <button id="closeAuthBtn" class="cancel-btn">Cancel</button>
    </div>
</div>

<input type="file" id="profileUpload" accept="image/*">

<script>
const SURL = "https://xxnuhisweolpibzthjcc.supabase.co";
const SKEY = "sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P";
const SB = window.supabase.createClient(SURL, SKEY);
let USER = null;
let CURRENT_TAB = 'feed';
let CURRENT_SHARE_URL = '';

// ============================================
// AUTH - MAGIC LINK
// ============================================
function openAuthModal() { 
    if (USER) return;
    document.getElementById('authModal').style.display = 'flex'; 
}
function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

document.getElementById('closeAuthBtn').onclick = closeAuthModal;

document.getElementById('magicLoginBtn').onclick = async () => {
    const email = document.getElementById('authEmail').value;
    if (!email) { alert('Enter your email'); return; }
    const { error } = await SB.auth.signInWithOtp({
        email: email.trim(),
        options: { emailRedirectTo: window.location.origin }
    });
    if (error) { alert('Error: ' + error.message); } 
    else { 
        alert('Magic link sent! Check your email.'); 
        closeAuthModal(); 
        document.getElementById('authEmail').value = '';
    }
};

async function logout() {
    await SB.auth.signOut();
    USER = null;
    location.reload();
}

async function handleMagicLink() {
    const hash = window.location.hash;
    if (hash && hash.includes('access_token')) {
        const params = new URLSearchParams(hash.substring(1));
        const access_token = params.get('access_token');
        const refresh_token = params.get('refresh_token');
        if (access_token) {
            await SB.auth.setSession({ access_token, refresh_token });
            window.location.href = window.location.pathname;
        }
    }
}

async function checkAuth() {
    const { data: { user } } = await SB.auth.getUser();
    USER = user;
    const userIcon = document.querySelector('.fa-user-circle');
    if (user) { 
        userIcon.classList.remove('far'); 
        userIcon.classList.add('fas'); 
    } else { 
        userIcon.classList.remove('fas'); 
        userIcon.classList.add('far'); 
    }
    return user;
}

// ============================================
// PROFILE PICTURE UPLOAD
// ============================================
async function uploadProfilePicture(file) {
    if (!USER) return;
    const fileName = `profile_${USER.id}.jpg`;
    await SB.storage.from("avatars").upload(fileName, file, { upsert: true });
    const { data: urlData } = SB.storage.from("avatars").getPublicUrl(fileName);
    await SB.from("profiles").upsert({ id: USER.id, avatar_url: urlData.publicUrl });
    return urlData.publicUrl;
}

document.getElementById('profileUpload').onchange = async (e) => {
    const file = e.target.files[0];
    if (file) {
        await uploadProfilePicture(file);
        alert('Profile picture updated!');
        loadProfile();
    }
};

// ============================================
// SHARE FUNCTIONS
// ============================================
function openShareModal(imageUrl) {
    CURRENT_SHARE_URL = imageUrl;
    document.getElementById('shareModal').style.display = 'block';
}
function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }

function shareTo(platform) {
    const url = encodeURIComponent(CURRENT_SHARE_URL);
    let shareLink = '';
    switch(platform) {
        case 'facebook': shareLink = `https://www.facebook.com/sharer/sharer.php?u=${url}`; break;
        case 'whatsapp': shareLink = `https://wa.me/?text=${url}`; break;
        case 'twitter': shareLink = `https://twitter.com/intent/tweet?url=${url}`; break;
        case 'instagram': alert('Save image first, then post manually.'); closeShareModal(); return;
    }
    if (shareLink) window.open(shareLink, '_blank');
    closeShareModal();
}

function copyLink() {
    navigator.clipboard.writeText(CURRENT_SHARE_URL);
    alert('Link copied!');
    closeShareModal();
}

// ============================================
// UI FUNCTIONS
// ============================================
function openModal(img) { document.getElementById('modalImage').src = img; document.getElementById('imageModal').style.display = 'flex'; }
function closeModal() { document.getElementById('imageModal').style.display = 'none'; }

function openUploadModal() {
    if (!USER) { alert('Please login first'); openAuthModal(); return; }
    document.getElementById('uploadModal').style.display = 'block';
}
function closeUploadModal() { document.getElementById('uploadModal').style.display = 'none'; document.getElementById('uploadFile').value = ''; document.getElementById('uploadCaption').value = ''; }

function switchTab(tab) { CURRENT_TAB = tab; loadFeed(); }

function bottomNav(page) {
    document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
    if (page === 'home') { 
        document.querySelector('.bottom-nav-item:first-child').classList.add('active'); 
        switchTab('feed'); 
    }
    if (page === 'profile') { 
        document.querySelector('.bottom-nav-item:last-child').classList.add('active'); 
        loadProfile(); 
    }
    if (page === 'friends') alert('Friends coming soon');
    if (page === 'inbox') alert('Inbox coming soon');
}

async function likePost(postId) {
    if (!USER) { alert('Login to like'); openAuthModal(); return; }
    try { 
        await SB.rpc("toggle_like", { post_id_input: postId, user_id_input: USER.id }); 
        // Update just the like count without full reload
        const { count } = await SB.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', postId);
        const likeSpan = document.getElementById(`likes-${postId}`);
        if (likeSpan) likeSpan.innerText = count || 0;
        const likeIcon = document.querySelector(`#like-icon-${postId}`);
        if (likeIcon) likeIcon.style.color = '#ff4444';
    } catch(e) { console.error(e); }
}

async function addComment(postId) {
    if (!USER) { alert('Login to comment'); openAuthModal(); return; }
    const input = document.getElementById(`comment-input-${postId}`);
    if (input.value.trim()) {
        await SB.from("comments").insert({ post_id: postId, user_id: USER.id, text: input.value });
        input.value = '';
        // Reload just the comments section
        const { data: comments } = await SB.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: false });
        const commentsDiv = document.getElementById(`comments-list-${postId}`);
        const countSpan = document.getElementById(`comment-count-${postId}`);
        if (commentsDiv) {
            commentsDiv.innerHTML = comments.map(c => `<div class="comment"><strong>User</strong> ${c.text}</div>`).join('') || '<div class="comment">No comments yet</div>';
        }
        if (countSpan) countSpan.innerText = comments.length;
    }
}

function toggleComments(id) { 
    const section = document.getElementById(`comments-${id}`); 
    if (section) section.style.display = section.style.display === 'none' ? 'block' : 'none'; 
}

async function deletePost(postId) {
    if (!USER) { alert('Login first'); return; }
    if (confirm('Delete this post?')) {
        await SB.from("posts").delete().eq("id", postId);
        loadFeed();
    }
}

async function uploadPost() {
    if (!USER) { alert('Login first'); return; }
    const file = document.getElementById("uploadFile").files[0];
    const caption = document.getElementById("uploadCaption").value;
    const privacy = document.getElementById("uploadPrivacy").value;
    if (!file) { alert("Select an image"); return; }
    const fileName = `${USER.id}_${Date.now()}.jpg`;
    await SB.storage.from("post-images").upload(fileName, file);
    const { data: urlData } = SB.storage.from("post-images").getPublicUrl(fileName);
    await SB.from("posts").insert({ 
        image_url: urlData.publicUrl, 
        caption: caption, 
        user_id: USER.id, 
        privacy: privacy,
        is_ai: false, 
        likes: 0 
    });
    alert("Posted!"); 
    closeUploadModal(); 
    loadFeed();
}

async function loadProfile() {
    if (!USER) { alert('Please login'); openAuthModal(); return; }
    const feedDiv = document.getElementById("feed");
    feedDiv.innerHTML = '<div class="loading">Loading profile...</div>';
    
    const { data: profile } = await SB.from("profiles").select("*").eq("id", USER.id).single();
    const { data: posts } = await SB.from("posts").select("*").eq("user_id", USER.id).order("id", { ascending: false });
    const { count } = await SB.from("posts").select("*", { count: 'exact', head: true }).eq("user_id", USER.id);
    
    let avatarHtml = profile?.avatar_url ? `<img src="${profile.avatar_url}">` : '👤';
    
    let html = `
        <div class="profile-header">
            <div class="profile-avatar" onclick="document.getElementById('profileUpload').click()">
                ${avatarHtml}
            </div>
            <h3>${USER.email.split('@')[0]}</h3>
            <div class="profile-bio">${profile?.bio || '✨ Fashion lover'}</div>
            <div class="profile-stats">
                <div><strong>${count || 0}</strong><br>posts</div>
                <div><strong>0</strong><br>followers</div>
                <div><strong>0</strong><br>following</div>
            </div>
            <button class="edit-profile-btn" onclick="editProfile()">Edit Profile</button>
            <button onclick="switchTab('feed')" style="background:#00ff88; color:black; border:none; padding:8px 20px; border-radius:20px; margin-top:10px; margin-left:10px;">Back to Feed</button>
        </div>`;
    
    for (const p of posts || []) { 
        let privacyIcon = p.privacy === 'public' ? '🌍' : (p.privacy === 'friends' ? '👥' : '🔒');
        html += `<div class="post">
            <div class="post-header">
                <div class="post-header-left">
                    <div class="m-logo">
                        <div class="tri tri1"></div>
                        <div class="tri tri2"></div>
                        <div class="tri tri3"></div>
                        <div class="tri tri4"></div>
                    </div>
                    <div class="post-username">${p.is_ai ? 'Poik Poik' : USER.email.split('@')[0]} <span class="privacy-badge privacy-${p.privacy || 'public'}">${privacyIcon} ${p.privacy || 'public'}</span></div>
                </div>
                <button class="delete-btn" onclick="deletePost(${p.id})"><i class="fas fa-trash"></i></button>
            </div>
            <img class="post-image" src="${p.image_url}" onclick="openModal('${p.image_url}')" loading="lazy">
            <div class="post-caption">${p.caption || 'Fashion visual'}</div>
        </div>`;
    }
    feedDiv.innerHTML = html;
}

async function editProfile() {
    const newBio = prompt('Enter your bio:', '✨ Fashion lover');
    if (newBio !== null) {
        await SB.from("profiles").upsert({ id: USER.id, bio: newBio });
        loadProfile();
    }
}

async function loadFeed() {
    const feedDiv = document.getElementById("feed");
    feedDiv.innerHTML = '<div class="loading">Loading...</div>';
    
    let query = SB.from("posts").select("*").order("id", { ascending: false });
    if (!USER) query = query.eq('privacy', 'public');
    else query = query.or(`privacy.eq.public,user_id.eq.${USER.id}`);
    
    const { data, error } = await query;
    if (error || !data || data.length === 0) { 
        feedDiv.innerHTML = '<div class="loading">No posts yet. AI Ghost is creating...</div>'; 
        return; 
    }
    
    let html = '';
    for (const p of data) {
        const { count: likeCount } = await SB.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', p.id);
        const { data: comments } = await SB.from('comments').select('*').eq('post_id', p.id).order('created_at', { ascending: false });
        const isOwner = USER && USER.id === p.user_id;
        let privacyIcon = p.privacy === 'public' ? '🌍' : (p.privacy === 'friends' ? '👥' : '🔒');
        
        html += `<div class="post">
            <div class="post-header">
                <div class="post-header-left">
                    <div class="m-logo">
                        <div class="tri tri1"></div>
                        <div class="tri tri2"></div>
                        <div class="tri tri3"></div>
                        <div class="tri tri4"></div>
                    </div>
                    <div class="post-username">${p.is_ai ? 'Poik Poik' : (p.user_id ? 'Member' : 'Poik Poik')} <span class="privacy-badge privacy-${p.privacy || 'public'}">${privacyIcon} ${p.privacy || 'public'}</span></div>
                </div>
                ${isOwner ? `<button class="delete-btn" onclick="deletePost(${p.id})"><i class="fas fa-trash"></i></button>` : ''}
            </div>
            <img class="post-image" src="${p.image_url}" onclick="openModal('${p.image_url}')" loading="lazy">
            <div class="post-caption">${p.caption || 'Fashion visual'}</div>
            <div class="post-actions-right">
                <div class="action-icon" onclick="likePost(${p.id})">
                    <i class="far fa-heart" id="like-icon-${p.id}"></i>
                    <span id="likes-${p.id}">${likeCount || 0}</span>
                </div>
                <div class="action-icon" onclick="toggleComments(${p.id})">
                    <i class="far fa-comment-dots"></i>
                    <span id="comment-count-${p.id}">${comments?.length || 0}</span>
                </div>
                <div class="action-icon" onclick="openShareModal('${p.image_url}')">
                    <i class="fas fa-share-alt"></i>
                    <span>Share</span>
                </div>
                <div class="action-icon" onclick="alert('Saved!')">
                    <i class="far fa-bookmark"></i>
                    <span>Save</span>
                </div>
            </div>
            <div class="comments-section" id="comments-${p.id}" style="display:none">
                <div id="comments-list-${p.id}">
                    ${comments?.map(c => `<div class="comment"><strong>User</strong> ${c.text}</div>`).join('') || '<div class="comment">No comments yet</div>'}
                </div>
                <div class="comment-input">
                    <input type="text" id="comment-input-${p.id}" placeholder="Add comment...">
                    <button onclick="addComment(${p.id})">Post</button>
                </div>
            </div>
        </div>`;
    }
    feedDiv.innerHTML = html;
}

// Also create avatars bucket in Supabase
async function initStorage() {
    try {
        await SB.storage.createBucket('avatars', { public: true });
    } catch(e) { console.log('Bucket exists'); }
}

initStorage();
handleMagicLink();
checkAuth();
loadFeed();
</script>
</body>
</html>
