<script>
// ============================================================
// COMPLETE FIXED VERSION - ALL 8 ISSUES
// ============================================================

let currentOpenChatUserId = null;
let refreshInterval = null;
let messagePollInterval = null;

// Helper functions
window.escapeHtml = function(text) { if (!text) return ''; return text.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); };

window.timeAgo = function(dateString) {
    if (!dateString) return '';
    const now = new Date();
    const then = new Date(dateString);
    const seconds = Math.floor((now - then) / 1000);
    if (seconds < 60) return 'just now';
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days === 1) return '1 day ago';
    if (days < 7) return `${days} days ago`;
    return `${Math.floor(days / 7)}w ago`;
};

function isVideoUrl(url) {
    return url && (url.endsWith('.mp4') || url.endsWith('.mov') || url.endsWith('.webm') || url.includes('video'));
}

// ----- UNREAD MESSAGE COUNT -----
async function getSimpleUnreadCount() {
    if (!window.USER) return 0;
    try {
        let query = SB
            .from("messages")
            .select("*", { count: 'exact', head: true })
            .eq("receiver_id", window.USER.id)
            .eq("is_read", false);
        
        // If user has a chat open, exclude messages from that person
        if (currentOpenChatUserId) {
            query = query.neq("sender_id", currentOpenChatUserId);
        }
        
        const { count } = await query;
        return count || 0;
    } catch(e) { return 0; }
}

// ----- GREEN PILL -----
async function showGreenPill() {
    const unreadCount = await getSimpleUnreadCount();
    if (unreadCount === 0) { hideGreenPill(); return; }
    
    let existingPill = document.getElementById('notification-pill');
    if (existingPill) existingPill.remove();
    
    const inboxBtn = document.getElementById('inboxNavBtn');
    if (inboxBtn) {
        const rect = inboxBtn.getBoundingClientRect();
        const pill = document.createElement('div');
        pill.id = 'notification-pill';
        pill.className = 'notification-pill';
        pill.style.position = 'fixed';
        pill.style.bottom = (window.innerHeight - rect.top + 5) + 'px';
        pill.style.left = (rect.left + rect.width / 2) + 'px';
        pill.style.transform = 'translateX(-50%)';
        pill.style.zIndex = '1002';
        pill.style.cursor = 'pointer';
        pill.innerHTML = `<div class="pill-inner"><span class="pill-item"><i class="fas fa-envelope" style="color:black;"></i> ${unreadCount}</span></div><div class="pill-pointer"></div>`;
        pill.onclick = () => { hideGreenPill(); bottomNav('inbox'); };
        document.body.appendChild(pill);
    }
}

function hideGreenPill() {
    const pill = document.getElementById('notification-pill');
    if (pill) pill.remove();
}

// ----- GREEN DOT -----
async function updateGreenDot() {
    const unreadCount = await getSimpleUnreadCount();
    const greenDot = document.getElementById('inboxGreenDot');
    if (greenDot) {
        if (unreadCount > 0) greenDot.classList.add('show');
        else greenDot.classList.remove('show');
    }
}

// ----- MARK MESSAGES AS READ -----
async function markMessagesRead(senderId) {
    if (!window.USER) return;
    await SB.from("messages").update({ is_read: true }).eq("sender_id", senderId).eq("receiver_id", window.USER.id).eq("is_read", false);
    await showGreenPill();
    await updateGreenDot();
}

// ----- SEND MESSAGE -----
async function sendSimpleMessage(receiverId, message) {
    if (!window.USER || !message.trim()) return false;
    try {
        await SB.from("messages").insert({
            sender_id: window.USER.id,
            receiver_id: receiverId,
            message: message.trim(),
            is_read: false
        });
        return true;
    } catch(e) { return false; }
}

// ----- GET CONVERSATIONS -----
async function getSimpleConversations() {
    if (!window.USER) return [];
    try {
        const { data: messages } = await SB
            .from("messages")
            .select("*")
            .or(`sender_id.eq.${window.USER.id},receiver_id.eq.${window.USER.id}`)
            .order("created_at", { ascending: false });
        
        if (!messages || messages.length === 0) return [];
        
        const convMap = new Map();
        for (const msg of messages) {
            const otherId = msg.sender_id === window.USER.id ? msg.receiver_id : msg.sender_id;
            if (!convMap.has(otherId)) {
                convMap.set(otherId, {
                    userId: otherId,
                    lastMessage: msg.message,
                    lastMessageTime: msg.created_at,
                    unreadCount: (msg.receiver_id === window.USER.id && !msg.is_read) ? 1 : 0
                });
            } else if (new Date(msg.created_at) > new Date(convMap.get(otherId).lastMessageTime)) {
                convMap.get(otherId).lastMessage = msg.message;
                convMap.get(otherId).lastMessageTime = msg.created_at;
            }
        }
        
        const userIds = [...convMap.keys()];
        const { data: profiles } = await SB.from("profiles").select("id, username, avatar_url, last_seen").in("id", userIds);
        const profileMap = new Map();
        if (profiles) profiles.forEach(p => profileMap.set(p.id, p));
        
        const result = [];
        for (const [userId, conv] of convMap) {
            const profile = profileMap.get(userId);
            result.push({
                userId: userId,
                username: profile?.username || 'User',
                avatarUrl: profile?.avatar_url,
                lastMessage: conv.lastMessage,
                lastMessageTime: conv.lastMessageTime,
                unreadCount: conv.unreadCount,
                isOnline: profile?.last_seen ? (new Date() - new Date(profile.last_seen)) < 120000 : false
            });
        }
        result.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));
        return result;
    } catch(e) { return []; }
}

// ----- GET MESSAGES WITH USER -----
async function getSimpleMessages(userId) {
    if (!window.USER) return [];
    try {
        const { data } = await SB
            .from("messages")
            .select("*")
            .or(`and(sender_id.eq.${window.USER.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${window.USER.id})`)
            .order("created_at", { ascending: true });
        
        const { data: profile } = await SB
            .from("profiles")
            .select("avatar_url, username, last_seen, id")
            .eq("id", userId)
            .single();
        
        return { messages: data || [], profile: profile };
    } catch(e) { return { messages: [], profile: null }; }
}

// ----- INBOX FUNCTIONS -----
let inboxTab = 'chats';

async function loadSimpleInbox() {
    const feedDiv = document.getElementById("feed");
    if (!feedDiv) return;
    if (!window.USER) { alert('Please login'); openAuthModal(); return; }
    
    window.isProfileView = true;
    window.isFriendsView = false;
    const topNav = document.querySelector('.top-nav');
    if (topNav) topNav.style.display = 'none';
    
    feedDiv.innerHTML = '<div class="loading">Loading inbox...</div>';
    await renderSimpleInbox();
}

async function renderSimpleInbox() {
    const feedDiv = document.getElementById("feed");
    feedDiv.innerHTML = `
        <div style="max-width:600px;margin:0 auto;padding-bottom:70px;">
            <div style="padding:16px;border-bottom:1px solid #222;"><h2 style="font-size:20px;">Inbox</h2></div>
            <div style="display:flex;border-bottom:1px solid #333;">
                <button onclick="switchInboxTabSimple('chats')" style="flex:1;background:none;border:none;padding:12px;color:${inboxTab==='chats'?'#00ff88':'#888'};border-bottom:2px solid ${inboxTab==='chats'?'#00ff88':'transparent'};cursor:pointer;font-weight:bold;">💬 Chats</button>
                <button onclick="switchInboxTabSimple('activity')" style="flex:1;background:none;border:none;padding:12px;color:${inboxTab==='activity'?'#00ff88':'#888'};border-bottom:2px solid ${inboxTab==='activity'?'#00ff88':'transparent'};cursor:pointer;font-weight:bold;">🔔 Activity</button>
            </div>
            <div id="inbox-content-simple">${inboxTab==='chats'?'<div class="loading">Loading chats...</div>':'<div class="loading">Loading notifications...</div>'}</div>
        </div>
    `;
    
    if (inboxTab === 'chats') await renderSimpleChats();
    else await renderSimpleActivity();
}

async function renderSimpleChats() {
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    
    const conversations = await getSimpleConversations();
    if (conversations.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px;color:#888;">No messages yet</div>';
        return;
    }
    
    let html = '<div style="padding:8px 0;">';
    for (const conv of conversations) {
        html += `
            <div onclick="openSimpleChat('${conv.userId}')" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;">
                ${conv.avatarUrl ? `<img src="${conv.avatarUrl}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">` : `<div style="width:50px;height:50px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:24px;">👤</div>`}
                <div style="flex:1;">
                    <div style="display:flex;justify-content:space-between;">
                        <span style="font-weight:bold;">${escapeHtml(conv.username)}</span>
                        <span style="font-size:10px;color:#888;">${timeAgo(conv.lastMessageTime)}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;">
                        <span style="font-size:13px;color:${conv.unreadCount>0?'#00ff88':'#888'}">${escapeHtml(conv.lastMessage.substring(0,40))}</span>
                        ${conv.unreadCount>0 ? `<span style="background:#00ff88;color:black;border-radius:12px;padding:2px 8px;font-size:10px;font-weight:bold;">${conv.unreadCount}</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    }
    html += '</div>';
    container.innerHTML = html;
}

async function openSimpleChat(userId) {
    currentOpenChatUserId = userId;
    await markMessagesRead(userId);
    await showGreenPill();
    await updateGreenDot();
    
    const result = await getSimpleMessages(userId);
    const messages = result.messages;
    const profile = result.profile;
    
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    
    let messagesHtml = '';
    if (messages.length === 0) {
        messagesHtml = '<div style="text-align:center;padding:40px;color:#888;">No messages yet. Say hi!</div>';
    } else {
        for (const msg of messages) {
            const isMine = msg.sender_id === window.USER.id;
            let avatarHtml = '';
            if (!isMine && profile) {
                avatarHtml = profile.avatar_url 
                    ? `<img src="${profile.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:8px;">` 
                    : `<div style="width:32px;height:32px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:8px;">👤</div>`;
            }
            messagesHtml += `
                <div style="display:flex;justify-content:${isMine ? 'flex-end' : 'flex-start'};align-items:flex-start;margin-bottom:8px;">
                    ${!isMine ? avatarHtml : ''}
                    <div style="max-width:70%;padding:10px 14px;border-radius:20px;background:${isMine ? '#00ff88' : '#222'};color:${isMine ? 'black' : 'white'};word-wrap:break-word;">
                        ${escapeHtml(msg.message)}
                        <div style="font-size:9px;color:${isMine ? '#006644' : '#888'};">${timeAgo(msg.created_at)}</div>
                    </div>
                </div>
            `;
        }
    }
    
    container.innerHTML = `
        <div class="chat-container-fixed">
            <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #333;background:#0a0a0a;">
                <button onclick="closeSimpleChat()" style="background:none;border:none;color:#00ff88;font-size:20px;cursor:pointer;">←</button>
                <div class="chat-header-clickable" onclick="goToProfileFromChat('${userId}')">
                    ${profile?.avatar_url ? `<img src="${profile.avatar_url}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">` : `<div style="width:40px;height:40px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;">👤</div>`}
                    <div><div style="font-weight:bold;">${escapeHtml(profile?.username || 'User')}</div></div>
                </div>
            </div>
            <div id="simple-chat-messages" class="chat-messages-fixed">${messagesHtml}</div>
            <div class="chat-input-fixed">
                <input type="text" id="simple-chat-input" placeholder="Message..." onkeypress="if(event.key==='Enter') sendSimpleChatMessage()">
                <button onclick="sendSimpleChatMessage()">➤</button>
            </div>
        </div>
    `;
    
    const msgContainer = document.getElementById('simple-chat-messages');
    if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;
    
    if (messagePollInterval) clearInterval(messagePollInterval);
    messagePollInterval = setInterval(async () => {
        if (currentOpenChatUserId) await refreshSimpleChatMessages();
    }, 2000);
}

async function refreshSimpleChatMessages() {
    if (!currentOpenChatUserId) return;
    const result = await getSimpleMessages(currentOpenChatUserId);
    const messages = result.messages;
    const profile = result.profile;
    const container = document.getElementById('simple-chat-messages');
    if (!container) return;
    
    if (messages.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">No messages yet. Say hi!</div>';
        return;
    }
    
    let html = '';
    for (const msg of messages) {
        const isMine = msg.sender_id === window.USER.id;
        let avatarHtml = '';
        if (!isMine && profile) {
            avatarHtml = profile.avatar_url 
                ? `<img src="${profile.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:8px;">` 
                : `<div style="width:32px;height:32px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:8px;">👤</div>`;
        }
        html += `
            <div style="display:flex;justify-content:${isMine ? 'flex-end' : 'flex-start'};align-items:flex-start;margin-bottom:8px;">
                ${!isMine ? avatarHtml : ''}
                <div style="max-width:70%;padding:10px 14px;border-radius:20px;background:${isMine ? '#00ff88' : '#222'};color:${isMine ? 'black' : 'white'};word-wrap:break-word;">
                    ${escapeHtml(msg.message)}
                    <div style="font-size:9px;color:${isMine ? '#006644' : '#888'};">${timeAgo(msg.created_at)}</div>
                </div>
            </div>
        `;
    }
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
}

async function sendSimpleChatMessage() {
    const input = document.getElementById('simple-chat-input');
    const message = input?.value.trim();
    if (!message || !currentOpenChatUserId) return;
    input.value = '';
    await sendSimpleMessage(currentOpenChatUserId, message);
    await refreshSimpleChatMessages();
}

async function closeSimpleChat() {
    if (messagePollInterval) clearInterval(messagePollInterval);
    currentOpenChatUserId = null;
    await renderSimpleChats();
}

// ----- ACTIVITY TAB WITH REAL NOTIFICATIONS -----
async function renderSimpleActivity() {
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    
    const { data: notifications } = await SB
        .from("notifications")
        .select(`*, actor:actor_id(id, username, avatar_url)`)
        .eq("user_id", window.USER?.id)
        .order("created_at", { ascending: false })
        .limit(50);
    
    if (!notifications || notifications.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px;color:#888;">No notifications yet</div>';
        return;
    }
    
    let html = '<div style="padding:8px 0;">';
    for (const n of notifications) {
        const actorName = n.actor?.username || 'Someone';
        let icon = '📢', actionText = '';
        if (n.type === 'follow') { icon = '👤'; actionText = 'started following you'; }
        else if (n.type === 'like_post') { icon = '❤️'; actionText = 'liked your post'; }
        else if (n.type === 'like_comment') { icon = '❤️'; actionText = 'liked your comment'; }
        else if (n.type === 'comment') { icon = '💬'; actionText = 'commented on your post'; }
        else if (n.type === 'reply') { icon = '💬'; actionText = 'replied to your comment'; }
        
        html += `
            <div onclick="goToProfileFromChat('${n.actor_id}')" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;">
                <div style="width:40px;height:40px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:20px;">${icon}</div>
                <div style="flex:1;">
                    <div><strong>${escapeHtml(actorName)}</strong> ${actionText}</div>
                    <div style="font-size:10px;color:#888;">${timeAgo(n.created_at)}</div>
                </div>
                ${!n.is_read ? '<div style="width:8px;height:8px;background:#00ff88;border-radius:50%;"></div>' : ''}
            </div>
        `;
    }
    html += '</div>';
    container.innerHTML = html;
}

async function switchInboxTabSimple(tab) {
    inboxTab = tab;
    if (messagePollInterval) clearInterval(messagePollInterval);
    currentOpenChatUserId = null;
    await renderSimpleInbox();
}

// ----- GO TO PROFILE FROM CHAT -----
function goToProfileFromChat(userId) {
    closeSimpleChat();
    if (typeof viewProfile === 'function') {
        viewProfile(userId);
    }
}

// ----- CREATE NOTIFICATION -----
async function createSimpleNotification(type, userId, actorId, targetId) {
    if (!userId || userId === actorId) return;
    await SB.from("notifications").insert({
        user_id: userId,
        actor_id: actorId,
        type: type,
        target_id: targetId || 0,
        is_read: false
    });
}

// ----- AUTO REFRESH -----
function startAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(async () => {
        await showGreenPill();
        await updateGreenDot();
        if (inboxTab === 'activity' && document.getElementById('inbox-content-simple')) {
            await renderSimpleActivity();
        }
    }, 5000);
}

// ----- INIT -----
(async function() {
    const sessionRestored = await restoreSession();
    if (!sessionRestored) await checkAuth();
    if (typeof loadFeed === 'function') loadFeed();
    if (window.USER) {
        setTimeout(() => {
            showGreenPill();
            updateGreenDot();
            startAutoRefresh();
        }, 2000);
    }
})();

// Expose functions
window.bottomNav = function(page) {
    document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
    if (page === 'home') {
        document.querySelector('.bottom-nav-item:first-child')?.classList.add('active');
        if (typeof goToHome === 'function') goToHome();
        else if (typeof refreshFeed === 'function') refreshFeed();
    } else if (page === 'friends') {
        document.querySelector('.bottom-nav-item:nth-child(2)')?.classList.add('active');
        window.isFriendsView = true;
        window.isProfileView = false;
        if (typeof loadFriends === 'function') loadFriends();
    } else if (page === 'inbox') {
        document.querySelector('.bottom-nav-item:nth-child(4)')?.classList.add('active');
        if (!window.USER) { alert('Please login'); openAuthModal(); return; }
        loadSimpleInbox();
    } else if (page === 'profile') {
        document.querySelector('.bottom-nav-item:last-child')?.classList.add('active');
        if (typeof loadProfile === 'function') loadProfile();
    }
};

window.loadInbox = loadSimpleInbox;
window.openChat = openSimpleChat;
window.closeChat = closeSimpleChat;
window.sendChatMessage = sendSimpleChatMessage;
window.switchInboxTab = switchInboxTabSimple;
window.showGreenPill = showGreenPill;
window.updateGreenDot = updateGreenDot;
window.createNotification = createSimpleNotification;
window.goToProfileFromChat = goToProfileFromChat;
</script>

<script>
setInterval(function() {
    if (typeof USER !== 'undefined' && USER && !window.USER) {
        window.USER = USER;
        if (typeof showGreenPill === 'function') showGreenPill();
        if (typeof updateGreenDot === 'function') updateGreenDot();
    }
}, 500);
</script>

</body>
</html>
