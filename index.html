<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Poik Poik | AI Media House</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
            padding: 12px 16px;
            z-index: 100;
        }
        
        .header-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Feed */
        .feed {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 0 60px 0;
        }
        
        .post {
            margin-bottom: 20px;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            cursor: pointer;
        }
        
        .post-image {
            width: 100%;
            aspect-ratio: 1 / 1.2;
            object-fit: cover;
            display: block;
        }
        
        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #0066ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .post-name {
            font-weight: 600;
            font-size: 14px;
        }
        
        .post-caption {
            padding: 0 16px 12px;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 12px;
        }
        
        /* Full Screen Modal */
        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .fullscreen-modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .close-fullscreen {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 1001;
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @media (max-width: 600px) {
            .post-image {
                aspect-ratio: 1 / 1.3;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">⚡ POIK<span>POIK</span></div>
        </div>
    </div>
    
    <div class="feed" id="feed">
        <div class="loading">✨ Loading stunning visuals...</div>
    </div>
    
    <footer>⚡ Poik Poik • New fashion visual every 10 minutes</footer>
    
    <!-- Full Screen Modal -->
    <div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreen()">
        <div class="close-fullscreen" onclick="closeFullscreen()">✕</div>
        <img id="fullscreenImage" src="" alt="Full screen view">
    </div>
    
    <script>
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentImageUrl = '';
        
        function openFullscreen(imageUrl) {
            document.getElementById('fullscreenImage').src = imageUrl;
            document.getElementById('fullscreenModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        
        function closeFullscreen() {
            document.getElementById('fullscreenModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        
        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = '<div class="loading">✨ Loading stunning visuals...</div>';
            
            const { data: posts, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error || !posts || posts.length === 0) {
                feedDiv.innerHTML = '<div class="loading">✨ No posts yet. AI Ghost is creating stunning fashion visuals...</div>';
                return;
            }
            
            let html = '';
            for (const post of posts) {
                // Clean caption - remove any "AI Ghost" prefix if present
                let cleanCaption = post.caption || '';
                cleanCaption = cleanCaption.replace(/^AI Ghost\s*[•\-]?\s*/, '');
                
                html += `
                    <div class="post" onclick="openFullscreen('${post.image_url}')">
                        <div class="post-header">
                            <div class="post-avatar">✨</div>
                            <div class="post-name">Poik Poik</div>
                        </div>
                        <img class="post-image" src="${post.image_url}" loading="lazy">
                        <div class="post-caption">${cleanCaption}</div>
                    </div>
                `;
            }
            feedDiv.innerHTML = html;
        }
        
        loadFeed();
        setInterval(loadFeed, 30000);
        
        // Close fullscreen with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeFullscreen();
            }
        });
    </script>
</body>
</html>
