<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poik Poik | AI Media House</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: system-ui; padding-bottom: 60px; }
        .header {
            position: sticky;
            top: 0;
            background: #000;
            border-bottom: 1px solid #222;
            padding: 12px 16px;
            z-index: 100;
        }
        .header-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 24px; font-weight: bold; }
        .logo span { color: #00ff88; }
        .btn {
            padding: 8px 16px;
            border-radius: 24px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: #00ff88; color: #000; }
        .btn-outline { background: transparent; border: 1px solid #333; color: #fff; }
        .feed { max-width: 600px; margin: 0 auto; }
        .post {
            margin-bottom: 20px;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
        }
        .post-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .post-username { font-weight: 600; font-size: 14px; }
        .post-badge { color: #00ff88; font-size: 12px; margin-left: 6px; }
        .post-caption { padding: 0 16px 12px; font-size: 14px; }
        .post-actions { padding: 8px 16px; display: flex; gap: 24px; }
        .action-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-area {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 2px dashed #333;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            background: #0a0a0a;
        }
        .loading { text-align: center; padding: 40px; color: #888; }
        footer { text-align: center; padding: 20px; color: #444; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">POIK<span>POIK</span></div>
            <div id="authButtons">
                <button class="btn btn-outline" onclick="alert('Login - Sign up via email')">Login</button>
                <button class="btn btn-primary" onclick="alert('Sign up - Use email')">Sign Up</button>
            </div>
        </div>
    </div>

    <div style="max-width:600px;margin:20px auto;padding:0 16px">
        <div class="upload-area" onclick="alert('Login to upload images')">
            📸 Click to upload your own image
        </div>
    </div>

    <div class="feed" id="feed">
        <div class="loading">Loading posts...</div>
    </div>

    <footer>⚡ Poik Poik • AI Media House • New image every 10 minutes</footer>

    <script>
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = '<div class="loading">Loading posts...</div>';
            
            const { data: posts, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                feedDiv.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
                return;
            }
            
            if (!posts || posts.length === 0) {
                feedDiv.innerHTML = '<div class="loading">No posts yet. AI Ghost is generating...</div>';
                return;
            }
            
            let html = '';
            for (const post of posts) {
                html += `
                    <div class="post">
                        <div class="post-header">
                            <div class="post-avatar">${post.is_ai ? '🤖' : '👤'}</div>
                            <div class="post-username">
                                ${post.is_ai ? 'Poik Ghost' : 'User'}
                                ${post.is_ai ? '<span class="post-badge">AI</span>' : ''}
                            </div>
                        </div>
                        <img class="post-image" src="${post.image_url}" loading="lazy">
                        <div class="post-caption">
                            <strong>${post.is_ai ? 'Poik Ghost' : 'User'}</strong> ${post.caption || ''}
                        </div>
                        <div class="post-actions">
                            <button class="action-btn">❤️ ${post.likes || 0}</button>
                            <button class="action-btn">💬 0</button>
                        </div>
                    </div>
                `;
            }
            feedDiv.innerHTML = html;
        }
        
        loadFeed();
    </script>
</body>
</html>
