<script>
// ============================================================
// COMPLETE FIXED VERSION - WITH BADGE-ONLY UPDATES
// ============================================================

let currentOpenChatUserId = null;
let refreshInterval = null;
let messagePollInterval = null;
let typingPollInterval = null;

// Badge state
let chatsUnreadCount = 0;
let activityUnreadCount = 0;

window.escapeHtml = function(text) { if (!text) return ''; return text.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); };

window.timeAgo = function(dateString) {
    if (!dateString) return '';
    const now = new Date();
    const then = new Date(dateString);
    const seconds = Math.floor((now - then) / 1000);
    if (seconds < 60) return 'just now';
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days === 1) return '1 day ago';
    if (days < 7) return `${days} days ago`;
    return `${Math.floor(days / 7)}w ago`;
};

// ========== UNREAD COUNTS ==========
async function getUnreadMessagesCount() {
    if (!window.USER) return 0;
    try {
        let query = SB
            .from("messages")
            .select("*", { count: 'exact', head: true })
            .eq("receiver_id", window.USER.id)
            .eq("is_read", false);
        
        if (currentOpenChatUserId) {
            query = query.neq("sender_id", currentOpenChatUserId);
        }
        const { count } = await query;
        return count || 0;
    } catch(e) { return 0; }
}

async function getUnreadNotificationsCount() {
    if (!window.USER) return { total: 0, likes: 0, comments: 0, follows: 0 };
    try {
        const { data: notifications } = await SB
            .from("notifications")
            .select("type")
            .eq("user_id", window.USER.id)
            .eq("is_read", false);
        
        let likes = 0, comments = 0, follows = 0;
        if (notifications) {
            for (const n of notifications) {
                if (n.type === 'like_post' || n.type === 'like_comment' || n.type === 'like_reply') likes++;
                else if (n.type === 'comment' || n.type === 'reply') comments++;
                else if (n.type === 'follow') follows++;
            }
        }
        return { total: likes + comments + follows, likes, comments, follows };
    } catch(e) { return { total: 0, likes: 0, comments: 0, follows: 0 }; }
}

// ========== GREEN PILL ==========
async function showGreenPill() {
    const msgCount = await getUnreadMessagesCount();
    const notifCounts = await getUnreadNotificationsCount();
    const total = msgCount + notifCounts.total;
    
    if (total === 0) { hideGreenPill(); return; }
    
    let existingPill = document.getElementById('notification-pill');
    if (existingPill) existingPill.remove();
    
    let pillContent = '';
    if (notifCounts.likes > 0) pillContent += `<span class="pill-item"><i class="fas fa-heart" style="color:black;"></i> ${notifCounts.likes}</span>`;
    if (notifCounts.comments > 0) pillContent += `<span class="pill-item"><i class="fas fa-comment" style="color:black;"></i> ${notifCounts.comments}</span>`;
    if (notifCounts.follows > 0) pillContent += `<span class="pill-item"><i class="fas fa-user-plus" style="color:black;"></i> ${notifCounts.follows}</span>`;
    if (msgCount > 0) pillContent += `<span class="pill-item"><i class="fas fa-envelope" style="color:black;"></i> ${msgCount}</span>`;
    
    if (pillContent === '') return;
    
    const inboxBtn = document.getElementById('inboxNavBtn');
    if (inboxBtn) {
        const rect = inboxBtn.getBoundingClientRect();
        const pill = document.createElement('div');
        pill.id = 'notification-pill';
        pill.className = 'notification-pill';
        pill.style.position = 'fixed';
        pill.style.bottom = (window.innerHeight - rect.top + 5) + 'px';
        pill.style.left = (rect.left + rect.width / 2) + 'px';
        pill.style.transform = 'translateX(-50%)';
        pill.style.zIndex = '1002';
        pill.style.cursor = 'pointer';
        pill.innerHTML = `<div class="pill-inner">${pillContent}</div><div class="pill-pointer"></div>`;
        pill.onclick = async () => { 
            hideGreenPill(); 
            bottomNav('inbox');
            setTimeout(async () => {
                if (typeof switchInboxTabSimple === 'function') {
                    await switchInboxTabSimple('activity');
                }
            }, 150);
        };
        document.body.appendChild(pill);
    }
}

function hideGreenPill() {
    const pill = document.getElementById('notification-pill');
    if (pill) pill.remove();
}

// ========== INBOX BADGE ==========
async function updateInboxBadge() {
    const msgCount = await getUnreadMessagesCount();
    const greenDot = document.getElementById('inboxGreenDot');
    if (greenDot) {
        if (msgCount > 0) greenDot.classList.add('show');
        else greenDot.classList.remove('show');
    }
}

async function updateTabCounts() {
    chatsUnreadCount = await getUnreadMessagesCount();
    const notif = await getUnreadNotificationsCount();
    activityUnreadCount = notif.total;
}

// ========== UPDATE ONLY BADGES (NO RE-RENDER) ==========
function updateInboxTabBadgesOnly() {
    const chatsBtn = document.querySelector('button[onclick*="switchInboxTabSimple(\'chats\')"]');
    const activityBtn = document.querySelector('button[onclick*="switchInboxTabSimple(\'activity\')"]');
    
    if (chatsBtn) {
        chatsBtn.innerHTML = `💬 Chats ${chatsUnreadCount > 0 ? `<span style="background:#00ff88;color:black;border-radius:10px;padding:0px 6px;margin-left:4px;font-size:11px;">${chatsUnreadCount}</span>` : ''}`;
    }
    
    if (activityBtn) {
        activityBtn.innerHTML = `🔔 Activity ${activityUnreadCount > 0 ? `<span style="background:#00ff88;color:black;border-radius:10px;padding:0px 6px;margin-left:4px;font-size:11px;">${activityUnreadCount}</span>` : ''}`;
    }
}

// ========== MARK FUNCTIONS ==========
async function markMessagesRead(senderId) {
    if (!window.USER) return;
    await SB.from("messages").update({ is_read: true }).eq("sender_id", senderId).eq("receiver_id", window.USER.id).eq("is_read", false);
    await updateTabCounts();
    await updateInboxBadge();
    updateInboxTabBadgesOnly();
    await showGreenPill();
}

async function markNotificationsAsRead() {
    if (!window.USER) return;
    await SB.from("notifications").update({ is_read: true }).eq("user_id", window.USER.id);
    await updateTabCounts();
    updateInboxTabBadgesOnly();
    await showGreenPill();
}

// ========== LOAD NOTIFICATION COUNTS ==========
async function loadNotificationCounts() {
    if (!window.USER) return;
    await updateTabCounts();
    await updateInboxBadge();
    updateInboxTabBadgesOnly();
    await showGreenPill();
}

// ========== SEND MESSAGE ==========
async function sendSimpleMessage(receiverId, message) {
    if (!window.USER || !message.trim()) return false;
    try {
        await SB.from("messages").insert({
            sender_id: window.USER.id,
            receiver_id: receiverId,
            message: message.trim(),
            is_read: false
        });
        await loadNotificationCounts();
        return true;
    } catch(e) { return false; }
}

// ========== GET CONVERSATIONS ==========
async function getSimpleConversations() {
    if (!window.USER) return [];
    try {
        const { data: messages } = await SB
            .from("messages")
            .select("*")
            .or(`sender_id.eq.${window.USER.id},receiver_id.eq.${window.USER.id}`)
            .order("created_at", { ascending: false });
        
        if (!messages || messages.length === 0) return [];
        
        const convMap = new Map();
        for (const msg of messages) {
            const otherId = msg.sender_id === window.USER.id ? msg.receiver_id : msg.sender_id;
            if (!convMap.has(otherId)) {
                convMap.set(otherId, {
                    userId: otherId,
                    lastMessage: msg.message,
                    lastMessageTime: msg.created_at,
                    unreadCount: (msg.receiver_id === window.USER.id && !msg.is_read && currentOpenChatUserId !== otherId) ? 1 : 0
                });
            } else {
                const conv = convMap.get(otherId);
                if (msg.created_at > conv.lastMessageTime) {
                    conv.lastMessage = msg.message;
                    conv.lastMessageTime = msg.created_at;
                }
                if (msg.receiver_id === window.USER.id && !msg.is_read && currentOpenChatUserId !== otherId) {
                    conv.unreadCount++;
                }
            }
        }
        
        const userIds = [...convMap.keys()];
        const { data: profiles } = await SB.from("profiles").select("id, username, avatar_url, last_seen").in("id", userIds);
        const profileMap = new Map();
        if (profiles) profiles.forEach(p => profileMap.set(p.id, p));
        
        const result = [];
        for (const [userId, conv] of convMap) {
            const profile = profileMap.get(userId);
            const isOnline = profile?.last_seen ? (new Date() - new Date(profile.last_seen)) < 120000 : false;
            result.push({
                userId: userId,
                username: profile?.username || 'User',
                avatarUrl: profile?.avatar_url,
                lastMessage: conv.lastMessage,
                lastMessageTime: conv.lastMessageTime,
                unreadCount: conv.unreadCount,
                isOnline: isOnline
            });
        }
        result.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));
        return result;
    } catch(e) { return []; }
}

// ========== GET MESSAGES WITH USER ==========
async function getSimpleMessages(userId) {
    if (!window.USER) return [];
    try {
        const { data } = await SB
            .from("messages")
            .select("*")
            .or(`and(sender_id.eq.${window.USER.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${window.USER.id})`)
            .order("created_at", { ascending: true });
        
        const { data: profile } = await SB
            .from("profiles")
            .select("avatar_url, username, last_seen, id")
            .eq("id", userId)
            .single();
        
        return { messages: data || [], profile: profile };
    } catch(e) { return { messages: [], profile: null }; }
}

// ========== TYPING INDICATOR ==========
async function updateTypingStatus(chatWithId, isTyping) {
    if (!window.USER) return;
    try {
        const { data: existing } = await SB
            .from("typing_status")
            .select("id")
            .eq("user_id", window.USER.id)
            .eq("chat_with_id", chatWithId)
            .single();
        
        if (existing) {
            await SB.from("typing_status").update({ is_typing: isTyping, updated_at: new Date().toISOString() }).eq("id", existing.id);
        } else {
            await SB.from("typing_status").insert({ user_id: window.USER.id, chat_with_id: chatWithId, is_typing: isTyping });
        }
    } catch(e) { console.error("Typing status error:", e); }
}

async function checkTypingStatus(chatWithId) {
    if (!window.USER) return false;
    try {
        const { data } = await SB.from("typing_status").select("is_typing, updated_at").eq("user_id", chatWithId).eq("chat_with_id", window.USER.id).single();
        if (data && data.is_typing) {
            const updatedAt = new Date(data.updated_at);
            const now = new Date();
            if ((now - updatedAt) < 5000) return true;
        }
        return false;
    } catch(e) { return false; }
}

function showTypingIndicator(show) {
    let indicator = document.getElementById('typing-indicator');
    if (show) {
        if (!indicator) {
            const container = document.getElementById('simple-chat-messages');
            if (container) {
                indicator = document.createElement('div');
                indicator.id = 'typing-indicator';
                indicator.className = 'typing-indicator';
                indicator.innerHTML = `<span></span><span></span><span></span>`;
                container.appendChild(indicator);
                container.scrollTop = container.scrollHeight;
            }
        }
    } else {
        if (indicator) indicator.remove();
    }
}

function startTypingPolling(chatWithId) {
    if (typingPollInterval) clearInterval(typingPollInterval);
    typingPollInterval = setInterval(async () => {
        if (currentOpenChatUserId === chatWithId) {
            const isTyping = await checkTypingStatus(chatWithId);
            showTypingIndicator(isTyping);
        }
    }, 2000);
}

function stopTypingPolling() {
    if (typingPollInterval) clearInterval(typingPollInterval);
    typingPollInterval = null;
    showTypingIndicator(false);
}

// ========== INBOX FUNCTIONS ==========
let inboxTab = 'chats';

async function loadSimpleInbox() {
    const feedDiv = document.getElementById("feed");
    if (!feedDiv) return;
    if (!window.USER) { alert('Please login'); openAuthModal(); return; }
    
    window.isProfileView = true;
    window.isFriendsView = false;
    const topNav = document.querySelector('.top-nav');
    if (topNav) topNav.style.display = 'none';
    
    feedDiv.innerHTML = '<div class="loading">Loading inbox...</div>';
    await updateTabCounts();
    await renderSimpleInbox();
}

async function renderSimpleInbox() {
    const feedDiv = document.getElementById("feed");
    feedDiv.innerHTML = `
        <div style="max-width:600px;margin:0 auto;padding-bottom:70px;">
            <div style="padding:16px;border-bottom:1px solid #222;"><h2 style="font-size:20px;">Inbox</h2></div>
            <div style="display:flex;border-bottom:1px solid #333;">
                <button onclick="window.switchInboxTabSimple('chats')" style="flex:1;background:none;border:none;padding:12px;color:${inboxTab==='chats'?'#00ff88':'#888'};border-bottom:2px solid ${inboxTab==='chats'?'#00ff88':'transparent'};cursor:pointer;font-weight:bold;">
                    💬 Chats ${chatsUnreadCount > 0 ? `<span style="background:#00ff88;color:black;border-radius:10px;padding:0px 6px;margin-left:4px;font-size:11px;">${chatsUnreadCount}</span>` : ''}
                </button>
                <button onclick="window.switchInboxTabSimple('activity')" style="flex:1;background:none;border:none;padding:12px;color:${inboxTab==='activity'?'#00ff88':'#888'};border-bottom:2px solid ${inboxTab==='activity'?'#00ff88':'transparent'};cursor:pointer;font-weight:bold;">
                    🔔 Activity ${activityUnreadCount > 0 ? `<span style="background:#00ff88;color:black;border-radius:10px;padding:0px 6px;margin-left:4px;font-size:11px;">${activityUnreadCount}</span>` : ''}
                </button>
            </div>
            <div id="inbox-content-simple">${inboxTab==='chats'?'<div class="loading">Loading chats...</div>':'<div class="loading">Loading notifications...</div>'}</div>
        </div>
    `;
    
    if (inboxTab === 'chats') await renderSimpleChats();
    else await renderSimpleActivity();
}

async function renderSimpleChats() {
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    
    const conversations = await getSimpleConversations();
    if (conversations.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px;color:#888;">No messages yet</div>';
        return;
    }
    
    let html = '<div style="padding:8px 0;">';
    for (const conv of conversations) {
        html += `
            <div onclick="openSimpleChat('${conv.userId}')" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;">
                <div style="position:relative;">
                    ${conv.avatarUrl ? `<img src="${conv.avatarUrl}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">` : `<div style="width:50px;height:50px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:24px;">👤</div>`}
                    ${conv.isOnline ? '<div class="online-dot"></div>' : ''}
                </div>
                <div style="flex:1;">
                    <div><span style="font-weight:bold;">${escapeHtml(conv.username)}</span><span style="font-size:10px;color:#888;float:right;">${timeAgo(conv.lastMessageTime)}</span></div>
                    <div><span style="font-size:13px;color:${conv.unreadCount>0?'#00ff88':'#888'}">${escapeHtml(conv.lastMessage.substring(0,40))}</span>${conv.unreadCount>0 ? `<span style="background:#00ff88;color:black;border-radius:12px;padding:2px 8px;font-size:10px;float:right;">${conv.unreadCount}</span>` : ''}</div>
                </div>
            </div>
        `;
    }
    html += '</div>';
    container.innerHTML = html;
}

async function openSimpleChat(userId) {
    currentOpenChatUserId = userId;
    
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    
    container.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100%;"><div class="loading">Loading chat...</div></div>';
    
    const result = await getSimpleMessages(userId);
    const messages = result.messages;
    const profile = result.profile;
    
    const isOnline = profile?.last_seen ? (new Date() - new Date(profile.last_seen)) < 120000 : false;
    
    let messagesHtml = '';
    if (messages.length === 0) {
        messagesHtml = '<div style="text-align:center;padding:40px;color:#888;">No messages yet. Say hi!</div>';
    } else {
        for (const msg of messages) {
            const isMine = msg.sender_id === window.USER.id;
            messagesHtml += `
                <div style="display:flex;justify-content:${isMine ? 'flex-end' : 'flex-start'};margin-bottom:8px;">
                    <div style="max-width:70%;padding:10px 14px;border-radius:20px;background:${isMine ? '#00ff88' : '#222'};color:${isMine ? 'black' : 'white'};">
                        ${escapeHtml(msg.message)}
                        <div style="font-size:9px;color:${isMine ? '#006644' : '#888'};">${timeAgo(msg.created_at)}</div>
                    </div>
                </div>
            `;
        }
    }
    
    container.innerHTML = `
        <div style="display:flex;flex-direction:column;height:calc(100vh - 130px);">
            <div style="display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #333;">
                <button onclick="closeSimpleChat()" style="background:none;border:none;color:#00ff88;font-size:20px;cursor:pointer;">←</button>
                <div style="position:relative;cursor:pointer;" onclick="goToProfileFromChat('${userId}')">
                    ${profile?.avatar_url ? `<img src="${profile.avatar_url}" style="width:40px;height:40px;border-radius:50%;">` : `<div style="width:40px;height:40px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;">👤</div>`}
                    ${isOnline ? '<div class="online-dot" style="position:absolute;bottom:0;right:0;"></div>' : ''}
                </div>
                <div onclick="goToProfileFromChat('${userId}')" style="cursor:pointer;">
                    <div style="font-weight:bold;">${escapeHtml(profile?.username || 'User')}</div>
                    <div style="font-size:10px;color:${isOnline ? '#00ff88' : '#888'};">${isOnline ? '🟢 Active now' : (profile?.last_seen ? `Last seen ${timeAgo(profile.last_seen)}` : 'Offline')}</div>
                </div>
            </div>
            <div id="simple-chat-messages" style="flex:1;overflow-y:auto;padding:16px;">${messagesHtml}</div>
            <div style="display:flex;gap:8px;padding:12px;border-top:1px solid #333;">
                <input type="text" id="simple-chat-input" placeholder="Message..." style="flex:1;padding:10px;border-radius:20px;background:#222;color:white;" onkeypress="if(event.key==='Enter') sendSimpleChatMessage()">
                <button onclick="sendSimpleChatMessage()" style="background:#00ff88;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;">➤</button>
            </div>
        </div>
    `;
    
    setTimeout(async () => {
        await markMessagesRead(userId);
        await loadNotificationCounts();
    }, 100);
    
    startTypingPolling(userId);
    
    const msgContainer = document.getElementById('simple-chat-messages');
    if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;
    
    if (messagePollInterval) clearInterval(messagePollInterval);
    messagePollInterval = setInterval(async () => { if (currentOpenChatUserId) await refreshSimpleChatMessages(); }, 3000);
}

async function refreshSimpleChatMessages() {
    if (!currentOpenChatUserId) return;
    const result = await getSimpleMessages(currentOpenChatUserId);
    const messages = result.messages;
    const container = document.getElementById('simple-chat-messages');
    if (!container) return;
    
    if (messages.length === 0) { container.innerHTML = '<div style="text-align:center;color:#888;padding:40px;">No messages yet. Say hi!</div>'; return; }
    
    let html = '';
    for (const msg of messages) {
        const isMine = msg.sender_id === window.USER.id;
        html += `
            <div style="display:flex;justify-content:${isMine ? 'flex-end' : 'flex-start'};margin-bottom:8px;">
                <div style="max-width:70%;padding:10px 14px;border-radius:20px;background:${isMine ? '#00ff88' : '#222'};color:${isMine ? 'black' : 'white'};">
                    ${escapeHtml(msg.message)}
                    <div style="font-size:9px;color:${isMine ? '#006644' : '#888'};">${timeAgo(msg.created_at)}</div>
                </div>
            </div>
        `;
    }
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
}

async function sendSimpleChatMessage() {
    const input = document.getElementById('simple-chat-input');
    const message = input?.value.trim();
    if (!message || !currentOpenChatUserId) return;
    input.value = '';
    await updateTypingStatus(currentOpenChatUserId, false);
    await sendSimpleMessage(currentOpenChatUserId, message);
    await refreshSimpleChatMessages();
}

async function closeSimpleChat() {
    if (currentOpenChatUserId) {
        await markMessagesRead(currentOpenChatUserId);
    }
    stopTypingPolling();
    if (messagePollInterval) clearInterval(messagePollInterval);
    currentOpenChatUserId = null;
    await updateTabCounts();
    updateInboxTabBadgesOnly();
    await renderSimpleInbox();
}

// ========== SWITCH INBOX TAB ==========
async function switchInboxTabSimple(tab) {
    inboxTab = tab;
    await renderSimpleInbox();
    
    if (tab === 'activity') {
        await renderSimpleActivity();
    }
    if (tab === 'chats') {
        await renderSimpleChats();
    }
}

// ========== RENDER ACTIVITY ==========
async function renderSimpleActivity() {
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    
    container.innerHTML = '<div style="padding:30px;text-align:center;color:#888;">Loading notifications...</div>';
    
    try {
        // Get notifications
        const { data: notifications, error: notifError } = await SB
            .from('notifications')
            .select('*')
            .eq('user_id', window.USER.id)
            .order('created_at', { ascending: false })
            .limit(100);
        
        console.log("📋 Notifications loaded:", notifications?.length || 0);
        
        if (notifError) {
            console.error("Notification error:", notifError);
            container.innerHTML = '<div style="padding:30px;text-align:center;color:red;">Error loading notifications</div>';
            return;
        }
        
        if (!notifications || notifications.length === 0) {
            container.innerHTML = '<div style="padding:50px;text-align:center;color:#888;"><i class="fas fa-bell" style="font-size:48px;margin-bottom:16px;opacity:0.5;"></i><p>No notifications yet</p></div>';
            return;
        }
        
        // Get actor profiles
        const actorIds = [...new Set(notifications.map(n => n.actor_id).filter(id => id))];
        let actorMap = new Map();
        
        if (actorIds.length > 0) {
            const { data: actors, error: actorError } = await SB
                .from('profiles')
                .select('id, username, avatar_url')
                .in('id', actorIds);
            
            if (!actorError && actors) {
                actors.forEach(a => actorMap.set(a.id, a));
            }
        }
        
        // Build HTML
        let html = '';
        for (const n of notifications) {
            const actor = actorMap.get(n.actor_id);
            const actorName = actor?.username || 'Someone';
            const actorAvatar = actor?.avatar_url;
            const timeText = window.timeAgo ? window.timeAgo(n.created_at) : new Date(n.created_at).toLocaleString();
            
            let icon = '🔔';
            let text = '';
            let clickAction = '';
            
            if (n.type === 'like_post' || n.type === 'like_comment' || n.type === 'like_reply') {
                icon = '❤️';
                text = 'liked your post';
                clickAction = `viewPostAndComments(${n.target_id})`;
            } else if (n.type === 'comment' || n.type === 'reply') {
                icon = '💬';
                text = 'commented on your post';
                clickAction = `viewPostAndComments(${n.target_id})`;
            } else if (n.type === 'follow') {
                icon = '👤';
                text = 'started following you';
                clickAction = `viewProfile('${n.actor_id}')`;
            }
            
            html += `
                <div onclick="${clickAction}" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;">
                    <div style="width:44px;height:44px;border-radius:50%;overflow:hidden;background:#222;display:flex;align-items:center;justify-content:center;font-size:20px;">
                        ${actorAvatar ? `<img src="${actorAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤'}
                    </div>
                    <div style="flex:1;">
                        <div style="font-size:14px;"><strong>${window.escapeHtml ? window.escapeHtml(actorName) : actorName}</strong> ${text}</div>
                        <div style="font-size:11px;color:#888;margin-top:4px;">${timeText}</div>
                    </div>
                    <div style="font-size:20px;">${icon}</div>
                </div>
            `;
        }
        container.innerHTML = html;
        
        // Mark as read
        await SB.from('notifications').update({ is_read: true }).eq('user_id', window.USER.id);
        await loadNotificationCounts();
        
    } catch (e) {
        console.error('Render activity error:', e);
        container.innerHTML = '<div style="padding:30px;text-align:center;color:red;">Error loading activity</div>';
    }
}

// ========== GO TO PROFILE FROM CHAT ==========
async function goToProfileFromChat(userId) {
    if (messagePollInterval) {
        clearInterval(messagePollInterval);
        messagePollInterval = null;
    }
    if (typingPollInterval) {
        clearInterval(typingPollInterval);
        typingPollInterval = null;
    }
    currentOpenChatUserId = null;
    
    if (typeof viewProfile === 'function') {
        await viewProfile(userId);
    }
}

// ========== VIEW POST AND COMMENTS ==========
async function viewPostAndComments(postId) {
    goToHome();
    setTimeout(() => {
        const commentsSection = document.getElementById(`comments-${postId}`);
        if (commentsSection) {
            commentsSection.style.display = 'block';
            if (typeof loadCommentsOnly === 'function') {
                loadCommentsOnly(postId);
            }
        }
    }, 500);
}

function goToHome() {
    window.isProfileView = false;
    window.isFriendsView = false;
    document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
    const homeBtn = document.querySelector('.bottom-nav-item:first-child');
    if (homeBtn) homeBtn.classList.add('active');
    const topNav = document.querySelector('.top-nav');
    if (topNav) topNav.style.display = 'flex';
    if (typeof refreshFeed === 'function') refreshFeed();
}

function startAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    
    refreshInterval = setInterval(async () => {
        await updateTabCounts();
        await updateInboxBadge();
        updateInboxTabBadgesOnly();
        await showGreenPill();
        
        if (inboxTab === 'chats' && !currentOpenChatUserId && document.getElementById('inbox-content-simple')) {
            await renderSimpleChats();
        }
    }, 10000);
}

// ========== INIT ==========
(async function() {
    const sessionRestored = await restoreSession();
    if (!sessionRestored) await checkAuth();
    if (typeof loadFeed === 'function') loadFeed();
    if (window.USER) {
        await loadNotificationCounts();
        setTimeout(() => {
            startAutoRefresh();
        }, 2000);
    }
})();

// Expose functions globally
window.bottomNav = function(page) {
    document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
    if (page === 'home') {
        document.querySelector('.bottom-nav-item:first-child')?.classList.add('active');
        goToHome();
    } else if (page === 'friends') {
        document.querySelector('.bottom-nav-item:nth-child(2)')?.classList.add('active');
        window.isFriendsView = true;
        window.isProfileView = false;
        if (typeof loadFriends === 'function') loadFriends();
    } else if (page === 'inbox') {
        document.querySelector('.bottom-nav-item:nth-child(4)')?.classList.add('active');
        if (!window.USER) { alert('Please login'); openAuthModal(); return; }
        loadSimpleInbox();
    } else if (page === 'profile') {
        document.querySelector('.bottom-nav-item:last-child')?.classList.add('active');
        if (typeof loadProfile === 'function') loadProfile();
    }
};

window.loadInbox = loadSimpleInbox;
window.openChat = openSimpleChat;
window.closeChat = closeSimpleChat;
window.sendChatMessage = sendSimpleChatMessage;
window.switchInboxTabSimple = switchInboxTabSimple;
window.showGreenPill = showGreenPill;
window.updateInboxBadge = updateInboxBadge;
window.createNotification = createSimpleNotification;
window.goToProfileFromChat = goToProfileFromChat;
window.updateTypingStatus = updateTypingStatus;
window.viewPostAndComments = viewPostAndComments;
window.loadNotificationCounts = loadNotificationCounts;
window.updateInboxTabBadgesOnly = updateInboxTabBadgesOnly;
window.createSimpleNotification = createSimpleNotification;    
</script>

<script>
window.addEventListener('focus', async () => {
    if (window.USER) {
        await loadNotificationCounts();
    }
});
</script>
