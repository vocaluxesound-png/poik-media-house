<script>
const API_URL = "https://xxnuhisweolpibzthjcc.supabase.co";
const API_KEY = "sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P";
const SB = window.supabase.createClient(API_URL, API_KEY);

let USER = null;
let CURRENT_TAB = 'feed';
let SHARE_URL = '';
let timestampInterval = null;

// Stores for user's likes/dislikes
let userLikedPosts = new Set();
let userLikedComments = new Set();
let userDislikedComments = new Set();
let userLikedReplies = new Set();
let userDislikedReplies = new Set();

// Store commentData for real-time timestamp updates
let storedCommentsData = new Map(); // key: postId, value: { comments, replies }

function escapeHtml(text) { if (!text) return ''; return text.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

// ========== TIME AGO FUNCTION (REAL-TIME READY) ==========
function timeAgo(dateString) {
    if (!dateString) return '';
    const now = new Date();
    const then = new Date(dateString);
    const seconds = Math.floor((now - then) / 1000);
    
    if (seconds < 60) return 'just now';
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days === 1) return 'yesterday';
    return `${days}d ago`;
}

// ========== UPDATE ALL TIMESTAMPS IN REAL-TIME ==========
function updateAllTimestamps() {
    // Update comment timestamps
    document.querySelectorAll('.comment-time').forEach(el => {
        const timestamp = el.getAttribute('data-timestamp');
        if (timestamp) {
            el.textContent = timeAgo(timestamp);
        }
    });
    // Update reply timestamps
    document.querySelectorAll('.reply-time').forEach(el => {
        const timestamp = el.getAttribute('data-timestamp');
        if (timestamp) {
            el.textContent = timeAgo(timestamp);
        }
    });
}

// ========== START REAL-TIME TIMESTAMP UPDATER ==========
function startTimestampUpdater() {
    if (timestampInterval) clearInterval(timestampInterval);
    timestampInterval = setInterval(() => {
        updateAllTimestamps();
    }, 60000); // Update every 60 seconds
}

// ========== AUTH ==========
function openAuthModal() { if (USER) return; document.getElementById('authModal').style.display = 'flex'; }
function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
document.getElementById('closeAuthBtn').onclick = closeAuthModal;

document.getElementById('magicLoginBtn').onclick = async () => {
    const email = document.getElementById('authEmail').value;
    if (!email) { alert('Enter your email'); return; }
    const { error } = await SB.auth.signInWithOtp({ email: email.trim(), options: { emailRedirectTo: window.location.origin } });
    if (error) { alert('Error: ' + error.message); } else { alert('Magic link sent! Check your email.'); closeAuthModal(); document.getElementById('authEmail').value = ''; }
};

async function logout() { await SB.auth.signOut(); USER = null; if (timestampInterval) clearInterval(timestampInterval); location.reload(); }
async function handleMagicLink() {
    const hash = window.location.hash;
    if (hash && hash.includes('access_token')) {
        const params = new URLSearchParams(hash.substring(1));
        const access_token = params.get('access_token');
        const refresh_token = params.get('refresh_token');
        if (access_token) { await SB.auth.setSession({ access_token, refresh_token }); window.location.href = window.location.pathname; }
    }
}
async function checkAuth() { const { data: { user } } = await SB.auth.getUser(); USER = user; const userIcon = document.querySelector('.fa-user-circle'); if (user) { userIcon.classList.remove('far'); userIcon.classList.add('fas'); } else { userIcon.classList.remove('fas'); userIcon.classList.add('far'); } return user; }

// ========== PROFILE ==========
async function uploadAvatar(file) {
    if (!USER) return;
    const fileName = `${USER.id}_${Date.now()}.jpg`;
    await SB.storage.from("avatars").upload(fileName, file, { upsert: true });
    const { data } = SB.storage.from("avatars").getPublicUrl(fileName);
    await SB.from("profiles").update({ avatar_url: data.publicUrl }).eq("id", USER.id);
    alert("Profile picture updated!");
    loadProfile(); loadFeed();
}
document.getElementById('avatarInput').onchange = async (e) => { if (e.target.files[0]) await uploadAvatar(e.target.files[0]); };

async function saveProfile() {
    if (!USER) return;
    const username = document.getElementById("editUsername").value;
    const bio = document.getElementById("editBio").value;
    await SB.from("profiles").upsert({ id: USER.id, username: username, bio: bio });
    alert("Profile updated!");
    document.getElementById('editProfileModal').style.display = 'none';
    loadProfile(); loadFeed();
}
function openEditProfile() {
    document.getElementById('editUsername').value = USER?.user_metadata?.username || '';
    document.getElementById('editBio').value = USER?.user_metadata?.bio || '';
    document.getElementById('editProfileModal').style.display = 'flex';
}
document.getElementById('closeEditModal').onclick = () => document.getElementById('editProfileModal').style.display = 'none';
document.getElementById('saveProfileBtn').onclick = saveProfile;

// ========== POST MENU ==========
function togglePostMenu(postId) { const menu = document.getElementById(`post-menu-${postId}`); document.querySelectorAll('.post-menu-dropdown').forEach(m => m.style.display = 'none'); menu.style.display = menu.style.display === 'none' ? 'block' : 'none'; }
async function changePostPrivacy(postId, newPrivacy) { await SB.from("posts").update({ privacy: newPrivacy }).eq("id", postId); loadFeed(); }
async function deletePost(postId) { if (confirm('Delete this post?')) { await SB.from("posts").delete().eq("id", postId); loadFeed(); if (CURRENT_TAB === 'profile') loadProfile(); } }

// ========== SHARE ==========
function openShareModal(url) { SHARE_URL = url; document.getElementById('shareModal').style.display = 'block'; }
function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }
function shareTo(platform) {
    const url = encodeURIComponent(SHARE_URL);
    let link = '';
    if (platform === 'facebook') link = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
    if (platform === 'whatsapp') link = `https://wa.me/?text=${url}`;
    if (platform === 'twitter') link = `https://twitter.com/intent/tweet?url=${url}`;
    if (platform === 'instagram') { alert('Save image first, then post manually.'); closeShareModal(); return; }
    if (link) window.open(link, '_blank');
    closeShareModal();
}
function copyLink() { navigator.clipboard.writeText(SHARE_URL); alert('Link copied!'); closeShareModal(); }

function openModal(img) { document.getElementById('modalImage').src = img; document.getElementById('imageModal').style.display = 'flex'; }
function closeModal() { document.getElementById('imageModal').style.display = 'none'; }
function openUploadModal() { if (!USER) { alert('Please login first'); openAuthModal(); return; } document.getElementById('uploadModal').style.display = 'block'; }

function bottomNav(page) {
    document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));

    if (page === 'profile') { document.querySelector('.bottom-nav-item:last-child').classList.add('active'); loadProfile(); }
}

// ========== POST LIKE ==========
async function likePost(postId) {
    if (!USER) { alert('Login to like'); openAuthModal(); return; }
    const { data: existing } = await SB.from("post_likes").select("*").eq("post_id", postId).eq("user_id", USER.id);
    if (existing && existing.length > 0) {
        await SB.from("post_likes").delete().eq("post_id", postId).eq("user_id", USER.id);
        userLikedPosts.delete(Number(postId));
    } else {
        await SB.from("post_likes").insert({ post_id: postId, user_id: USER.id });
        userLikedPosts.add(Number(postId));
    }
    const { count } = await SB.from("post_likes").select("*", { count: 'exact', head: true }).eq("post_id", postId);
    const likeSpan = document.getElementById(`likes-${postId}`);
    if (likeSpan) likeSpan.innerText = count || 0;
    const likeBtn = document.getElementById(`like-btn-${postId}`);
    if (likeBtn) {
        if (userLikedPosts.has(Number(postId))) likeBtn.classList.add('liked');
        else likeBtn.classList.remove('liked');
    }
}

// ========== COMMENT FUNCTIONS ==========
async function addComment(postId) {
    const { data: { user } } = await SB.auth.getUser();
    if (!user) { alert('Login to comment'); openAuthModal(); return; }
    const input = document.getElementById(`comment-input-${postId}`);
    const text = input.value.trim();
    if (!text) { alert('Write a comment first'); return; }
    const { error } = await SB.from("comments").insert({ post_id: postId, user_id: user.id, text: text });
    if (error) { alert("Failed: " + error.message); return; }
    input.value = '';
    await loadCommentsOnly(postId);
    const { count } = await SB.from("comments").select("*", { count: 'exact', head: true }).eq("post_id", postId);
    const countSpan = document.getElementById(`comment-count-${postId}`);
    if (countSpan) countSpan.innerText = count || 0;
}
function toggleComments(postId) {
    const section = document.getElementById(`comments-${postId}`);
    if (section) { const isHidden = section.style.display === 'none'; section.style.display = isHidden ? 'block' : 'none'; if (isHidden) { loadCommentsOnly(postId); } }
}

// ========== UPLOAD POST ==========
async function uploadPost() {
    if (!USER) { alert('Login first'); return; }
    const file = document.getElementById("uploadFile").files[0];
    const caption = document.getElementById("uploadCaption").value;
    const privacy = document.getElementById("uploadPrivacy").value;
    if (!file) { alert("Select an image"); return; }
    const fileName = `${USER.id}_${Date.now()}.jpg`;
    await SB.storage.from("post-images").upload(fileName, file);
    const { data } = SB.storage.from("post-images").getPublicUrl(fileName);
    await SB.from("posts").insert({ image_url: data.publicUrl, caption: caption, user_id: USER.id, privacy: privacy, is_ai: false, likes: 0 });
    alert("Posted!"); closeUploadModal(); loadFeed();
}

// ========== LOAD PROFILE ==========
async function loadProfile() {
    if (!USER) { alert('Please login'); openAuthModal(); return; }
    const feedDiv = document.getElementById("feed");
    feedDiv.innerHTML = '<div class="loading">Loading profile...</div>';
    const { data: profile } = await SB.from("profiles").select("*").eq("id", USER.id).single();
    const { data: posts } = await SB.from("posts").select("*").eq("user_id", USER.id).order("id", { ascending: false });
    const { count } = await SB.from("posts").select("*", { count: 'exact', head: true }).eq("user_id", USER.id);
    const avatarHtml = profile?.avatar_url ? `<img src="${profile.avatar_url}">` : '👤';
    let html = `<div class="profile-header"><div class="profile-avatar" onclick="document.getElementById('avatarInput').click()">${avatarHtml}</div><h3>${profile?.username || USER.email.split('@')[0]}</h3><div class="profile-bio">${profile?.bio || 'No bio yet'}</div><div class="profile-stats"><div><strong>${count || 0}</strong><br>posts</div><div><strong>0</strong><br>followers</div><div><strong>0</strong><br>following</div></div><button class="edit-profile-btn" onclick="openEditProfile()">Edit Profile</button><button onclick="switchTab('feed')" style="background:#00ff88; color:black; border:none; padding:8px 20px; border-radius:20px; margin-top:10px; margin-left:10px;">Back to Feed</button></div>`;
    for (const p of posts || []) {
        let privacyIcon = p.privacy === 'public' ? '🌍' : (p.privacy === 'friends' ? '👥' : '🔒');
        let privacyText = p.privacy === 'public' ? 'Public' : (p.privacy === 'friends' ? 'Friends' : 'Only Me');
        let avatarDisplay = profile?.avatar_url ? `<img src="${profile.avatar_url}" class="user-avatar">` : `<div class="m-logo"><div class="tri tri1"></div><div class="tri tri2"></div><div class="tri tri3"></div><div class="tri tri4"></div></div>`;
        html += `<div class="post"><div class="post-header"><div class="post-header-left">${avatarDisplay}<div class="post-username">${profile?.username || 'User'}</div></div><div class="post-privacy-menu"><button class="privacy-badge privacy-${p.privacy || 'public'}" onclick="togglePostMenu(${p.id})">${privacyIcon} ${privacyText}</button><div id="post-menu-${p.id}" class="post-menu-dropdown" style="display:none;"><div class="post-menu-option" onclick="changePostPrivacy(${p.id}, 'public')">🌍 Public</div><div class="post-menu-option" onclick="changePostPrivacy(${p.id}, 'friends')">👥 Friends Only</div><div class="post-menu-option" onclick="changePostPrivacy(${p.id}, 'private')">🔒 Only Me</div><div class="post-menu-option delete-option" onclick="deletePost(${p.id})">🗑️ Delete</div></div></div></div><img class="post-image" src="${p.image_url}" onclick="openModal('${p.image_url}')" loading="lazy"><div class="post-caption">${p.caption || 'Fashion visual'}</div></div>`;
    }
    feedDiv.innerHTML = html;
}

// ========== LOAD COMMENTS ONLY ==========
async function loadCommentsOnly(postId) {
    const commentsList = document.getElementById(`comments-list-${postId}`);
    if (!commentsList) return;
    commentsList.innerHTML = '<div class="comment">Loading comments...</div>';
    
    const { data: comments } = await SB.from("comments").select(`*, profiles(username, avatar_url)`).eq("post_id", postId).order("created_at", { ascending: true });
    
    if (!comments || comments.length === 0) { 
        commentsList.innerHTML = '<div class="comment">No comments yet. Be the first!</div>'; 
        return; 
    }
    
    const { data: allReplies } = await SB.from("comment_replies").select(`*, profiles(username, avatar_url)`).eq("post_id", postId).order("created_at", { ascending: true });
    const replies = allReplies || [];
    
    let html = '';
    for (const c of comments) {
        const { count: likeCount } = await SB.from("comment_likes").select("*", { count: 'exact', head: true }).eq("comment_id", c.id);
        const { count: dislikeCount } = await SB.from("comment_dislikes").select("*", { count: 'exact', head: true }).eq("comment_id", c.id);
        let isLiked = userLikedComments.has(Number(c.id));
        let isDisliked = userDislikedComments.has(Number(c.id));
        const isOwner = USER && USER.id === c.user_id;
        const commenterName = c.profiles?.username || 'User';
        const commenterAvatar = c.profiles?.avatar_url;
        const commentTimestamp = c.created_at;
        const commentReplies = replies.filter(r => r.comment_id === c.id && !r.parent_reply_id);
        
        let repliesHtml = '';
        for (const r of commentReplies) {
            const { count: rLikes } = await SB.from("reply_likes").select("*", { count: 'exact', head: true }).eq("reply_id", r.id);
            const { count: rDislikes } = await SB.from("reply_dislikes").select("*", { count: 'exact', head: true }).eq("reply_id", r.id);
            let isReplyLiked = userLikedReplies.has(Number(r.id));
            let isReplyDisliked = userDislikedReplies.has(Number(r.id));
            const isReplyOwner = USER && USER.id === r.user_id;

            const replyerAvatar = r.profiles?.avatar_url;
            const replyTimestamp = r.created_at;

                const nestedTimestamp = nr.created_at;
                nestedHtml += `

                            ${nestedAvatar ? `<img src="${nestedAvatar}" class="reply-avatar">` : `<div class="reply-avatar">👤</div>`}

                        <div class="reply-actions">

                            <span id="reply-dislike-btn-${nr.id}" class="reply-action ${isNestedDisliked ? 'disliked' : ''}" onclick="dislikeReply(${nr.id})">👍 <span id="reply-dislike-${nr.id}">${nrDislikes || 0}</span></span>

                        ${isNestedOwner ? `
                        <div class="reply-menu">
                            <button class="reply-menu-btn" onclick="toggleReplyMenu(${nr.id})">⋮</button>
                            <div id="reply-menu-${nr.id}" class="reply-menu-dropdown" style="display:none;">
                                <div class="reply-menu-option delete" onclick="deleteReply(${nr.id}, ${postId})">Delete</div>
                            </div>

            repliesHtml += `

                        ${replyerAvatar ? `<img src="${replyerAvatar}" class="reply-avatar">` : `<div class="reply-avatar">👤</div>`}

                    </div>
                    <div id="reply-input-${r.id}" class="reply-input" style="display:none;">
                        <input type="text" id="reply-text-${r.id}" placeholder="Write a reply...">
                        <button onclick="addReplyToReply(${c.id}, ${r.id}, ${postId})">Reply</button>
                    </div>
                    ${nestedHtml}

                    <div class="reply-menu">
                        <button class="reply-menu-btn" onclick="toggleReplyMenu(${r.id})">⋮</button>
                        <div id="reply-menu-${r.id}" class="reply-menu-dropdown" style="display:none;">
                            <div class="reply-menu-option delete" onclick="deleteReply(${r.id}, ${postId})">Delete</div>

                    </div>` : ''}
                </div>`;
        }
        
        html += `
            <div class="comment">
                <div class="comment-header">
                    ${commenterAvatar ? `<img src="${commenterAvatar}" class="comment-avatar">` : `<div class="comment-avatar">👤</div>`}
                    <span class="comment-username">${escapeHtml(commenterName)}</span>
                    <span class="comment-time" data-timestamp="${commentTimestamp}">${timeAgo(commentTimestamp)}</span>
                </div>
                <div class="comment-text">${escapeHtml(c.text)}</div>
                <div class="comment-actions">
                    <span id="comment-like-btn-${c.id}" class="comment-action ${isLiked ? 'liked' : ''}" onclick="likeComment(${c.id})">❤️ <span id="comment-like-${c.id}">${likeCount || 0}</span></span>
                    <span id="comment-dislike-btn-${c.id}" class="comment-action ${isDisliked ? 'disliked' : ''}" onclick="dislikeComment(${c.id})">👍 <span id="comment-dislike-${c.id}">${dislikeCount || 0}</span></span>
                    <span class="comment-action" onclick="showReplyInputForComment(${c.id}, ${postId})">💬 Reply</span>
                </div>
                <div id="reply-comment-input-${c.id}" class="reply-input" style="display:none;">
                    <input type="text" id="reply-comment-text-${c.id}" placeholder="Write a reply...">
                    <button onclick="addReplyToComment(${c.id}, ${postId})">Reply</button>
                </div>
                <div id="replies-container-${c.id}" class="replies">${repliesHtml}</div>
                ${isOwner ? `
                <div class="comment-menu">
                    <button class="comment-menu-btn" onclick="toggleCommentMenu(${c.id})">⋮</button>
                    <div id="comment-menu-${c.id}" class="comment-menu-dropdown" style="display:none;">
                        <div class="comment-menu-option delete" onclick="deleteComment(${c.id}, ${postId})">Delete</div>
                    </div>
                </div>` : ''}
            </div>`;
    }
    commentsList.innerHTML = html;
    
    // Update timestamps after loading
    updateAllTimestamps();
}

// ========== LOAD USER INTERACTIONS ==========
async function loadUserInteractions() {
    if (!USER) return;
    
    userLikedPosts.clear();
    userLikedComments.clear();
    userDislikedComments.clear();
    userLikedReplies.clear();
    userDislikedReplies.clear();
    
    const { data: postLikes } = await SB.from("post_likes").select("post_id").eq("user_id", USER.id);
    if (postLikes) postLikes.forEach(l => userLikedPosts.add(Number(l.post_id)));
    
    const { data: commentLikes } = await SB.from("comment_likes").select("comment_id").eq("user_id", USER.id);
    if (commentLikes) commentLikes.forEach(l => userLikedComments.add(Number(l.comment_id)));
    
    const { data: commentDislikes } = await SB.from("comment_dislikes").select("comment_id").eq("user_id", USER.id);
    if (commentDislikes) commentDislikes.forEach(d => userDislikedComments.add(Number(d.comment_id)));
    
    const { data: replyLikes } = await SB.from("reply_likes").select("reply_id").eq("user_id", USER.id);
    if (replyLikes) replyLikes.forEach(l => userLikedReplies.add(Number(l.reply_id)));
    
    const { data: replyDislikes } = await SB.from("reply_dislikes").select("reply_id").eq("user_id", USER.id);
    if (replyDislikes) replyDislikes.forEach(d => userDislikedReplies.add(Number(d.reply_id)));
}

// ========== LOAD FEED ==========
async function loadFeed() {
    const feedDiv = document.getElementById("feed");
    feedDiv.innerHTML = '<div class="loading">Loading posts...</div>';
    
    await loadUserInteractions();
    
    const { data: posts, error } = await SB.from("posts").select("*").order("id", { ascending: false });
    if (error || !posts || posts.length === 0) { feedDiv.innerHTML = '<div class="loading">No posts yet. AI Ghost is creating...</div>'; return; }
    
    const userIds = [...new Set(posts.filter(p => p.user_id && !p.is_ai).map(p => p.user_id))];
    let profiles = {};
    if (userIds.length > 0) {
        const { data: profileData } = await SB.from("profiles").select("id, username, avatar_url").in("id", userIds);
        if (profileData) profileData.forEach(p => { profiles[p.id] = p; });
    }
    
    let html = '';
    for (const p of posts) {
        const { count: likeCount } = await SB.from("post_likes").select("*", { count: 'exact', head: true }).eq("post_id", p.id);
        const isLiked = userLikedPosts.has(Number(p.id));
        const { data: commentsData } = await SB.from("comments").select("*").eq("post_id", p.id);
        let totalCommentCount = commentsData.length;
        for (const c of commentsData) {
            const { count: replyCount } = await SB.from("comment_replies").select("*", { count: 'exact', head: true }).eq("comment_id", c.id);
            totalCommentCount += replyCount;
        }
        const isOwner = USER && USER.id === p.user_id;
        let privacyIcon = p.privacy === 'public' ? '🌍' : (p.privacy === 'friends' ? '👥' : '🔒');
        let privacyText = p.privacy === 'public' ? 'Public' : (p.privacy === 'friends' ? 'Friends' : 'Only Me');
        let displayName = 'Poik Poik';
        let avatarHtml = '';
        if (p.is_ai) { displayName = 'Poik Poik'; avatarHtml = `<div class="m-logo"><div class="tri tri1"></div><div class="tri tri2"></div><div class="tri tri3"></div><div class="tri tri4"></div></div>`; }
        else if (p.user_id && profiles[p.user_id]) { displayName = profiles[p.user_id].username || 'Member'; avatarHtml = profiles[p.user_id].avatar_url ? `<img src="${profiles[p.user_id].avatar_url}" class="user-avatar">` : `<div class="m-logo"><div class="tri tri1"></div><div class="tri tri2"></div><div class="tri tri3"></div><div class="tri tri4"></div></div>`; }
        else { displayName = 'Member'; avatarHtml = `<div class="m-logo"><div class="tri tri1"></div><div class="tri tri2"></div><div class="tri tri3"></div><div class="tri tri4"></div></div>`; }
        
        html += `<div class="post">
            <div class="post-header">
                <div class="post-header-left">
                    ${avatarHtml}
                    <div class="post-username">${escapeHtml(displayName)}</div>
                </div>
                ${isOwner ? `<div class="post-privacy-menu"><button class="privacy-badge privacy-${p.privacy || 'public'}" onclick="togglePostMenu(${p.id})">${privacyIcon} ${privacyText}</button><div id="post-menu-${p.id}" class="post-menu-dropdown" style="display:none;"><div class="post-menu-option" onclick="changePostPrivacy(${p.id}, 'public')">🌍 Public</div><div class="post-menu-option" onclick="changePostPrivacy(${p.id}, 'friends')">👥 Friends Only</div><div class="post-menu-option" onclick="changePostPrivacy(${p.id}, 'private')">🔒 Only Me</div><div class="post-menu-option delete-option" onclick="deletePost(${p.id})">🗑️ Delete</div></div></div>` : ''}
            </div>
            <img class="post-image" src="${p.image_url}" onclick="openModal('${p.image_url}')" loading="lazy">
            <div class="post-caption">${escapeHtml(p.caption || 'Fashion visual')}</div>
            <div class="post-actions-right">
                <div id="like-btn-${p.id}" class="action-icon ${isLiked ? 'liked' : ''}" onclick="likePost(${p.id})">
                    <i class="fas fa-heart"></i>
                    <span id="likes-${p.id}">${likeCount || 0}</span>
                </div>
                <div class="action-icon" onclick="toggleComments(${p.id})">
                    <i class="far fa-comment-dots"></i>
                    <span id="comment-count-${p.id}">${totalCommentCount || 0}</span>
                </div>
                <div class="action-icon share-icon" onclick="openShareModal('${p.image_url}')">
                    <i class="fas fa-paper-plane"></i>
                    <span>Share</span>
                </div>
                <div class="action-icon" onclick="alert('Saved!')">
                    <i class="far fa-bookmark"></i>
                    <span>Save</span>
                </div>
            </div>
            <div class="comments-section" id="comments-${p.id}" style="display:none">
                <div class="comments-header">
                    <span class="comments-title">💬 Comments (${totalCommentCount || 0})</span>
                    <button class="close-comments" onclick="document.getElementById('comments-${p.id}').style.display='none'">✕</button>
                </div>
                <div id="comments-list-${p.id}">Loading comments...</div>
                <div class="comment-input">
                    <input type="text" id="comment-input-${p.id}" placeholder="Add comment...">
                    <button onclick="addComment(${p.id})">Post</button>
                </div>
            </div>
        </div>`;
    }
    feedDiv.innerHTML = html;
    
    // Start real-time timestamp updater
    startTimestampUpdater();
}

async function initStorage() { try { await SB.storage.createBucket('avatars', { public: true }); } catch(e) {} }
initStorage();
handleMagicLink();
checkAuth().then(() => { loadFeed(); });
</script>
