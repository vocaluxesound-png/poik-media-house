<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poik Poik</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: black;
            color: white;
            font-family: system-ui;
            margin: 0;
            padding: 20px;
        }
        .feed {
            max-width: 600px;
            margin: 0 auto;
        }
        .post {
            margin-bottom: 30px;
            background: #111;
            border-radius: 16px;
            overflow: hidden;
        }
        .post img {
            width: 100%;
            display: block;
        }
        .caption {
            padding: 12px;
            font-size: 14px;
            color: #ccc;
        }
        h2 {
            text-align: center;
            color: #00ff88;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
    </style>
</head>
<body>
    <h2>⚡ POIK POIK</h2>
    <div id="feed">
        <div class="loading">Loading...</div>
    </div>

    <script>
        const url = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const key = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        
        const client = window.supabase.createClient(url, key);
        
        client
            .from('posts')
            .select('*')
            .order('id', { ascending: false })
            .then(result => {
                const feed = document.getElementById('feed');
                if (result.error) {
                    feed.innerHTML = `<div class="loading">Error: ${result.error.message}</div>`;
                } else if (!result.data || result.data.length === 0) {
                    feed.innerHTML = '<div class="loading">No posts yet. Ghost is creating...</div>';
                } else {
                    let html = '';
                    for (const post of result.data) {
                        html += `
                            <div class="post">
                                <img src="${post.image_url}" loading="lazy">
                                <div class="caption">${post.caption || 'Fashion'}</div>
                            </div>
                        `;
                    }
                    feed.innerHTML = html;
                }
            });
    </script>
</body>
</html>
