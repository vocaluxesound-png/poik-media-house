<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poik Poik | AI Media House</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin:0;
    background:#000;
    color:#fff;
    font-family:system-ui;
}

.header {
    position:sticky;
    top:0;
    background:#000;
    padding:12px;
    border-bottom:1px solid #222;
    text-align:center;
    font-weight:bold;
}

.feed {
    max-width:600px;
    margin:auto;
}

.post {
    margin-bottom:20px;
    border-bottom:1px solid #222;
}

.post img {
    width:100%;
    display:block;
}

.caption {
    padding:10px;
    font-size:14px;
}

.loading {
    text-align:center;
    padding:40px;
    color:#888;
}
</style>
</head>

<body>

<div class="header">POIK POIK ⚡</div>

<div id="feed" class="feed">
    <div class="loading">Loading...</div>
</div>

<script>
const supabase = window.supabase.createClient(
    "https://xxnuhisweolpibzthjcc.supabase.co",
    "sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P"
);

async function loadPosts() {
    const feed = document.getElementById("feed");

    const { data, error } = await supabase
        .from("posts")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        feed.innerHTML = "<div class='loading'>Error loading posts</div>";
        return;
    }

    if (!data || data.length === 0) {
        feed.innerHTML = "<div class='loading'>No posts yet...</div>";
        return;
    }

    let html = "";

    data.forEach(post => {
        if (!post.image_url) return;

        html += `
        <div class="post">
            <img src="${post.image_url}" onerror="this.remove()">
            <div class="caption">${post.caption || ""}</div>
        </div>
        `;
    });

    feed.innerHTML = html;
}

loadPosts();
</script>

</body>
</html>
