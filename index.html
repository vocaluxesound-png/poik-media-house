<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Poik Poik | Social Fashion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* [STYLES REMAIN THE SAME AS YOUR PROVIDED CSS - REDACTED FOR BREVITY TO FOCUS ON CODE] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; color: white; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 70px; overflow-x: hidden; }
        .header { position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 12px 16px; z-index: 100; border-bottom: 1px solid #222; }
        .header-content { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #00ff88 40%, #ffffff 60%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-icons { display: flex; gap: 16px; align-items: center; }
        .header-icons i { font-size: 22px; cursor: pointer; color: #ccc; }
        
        .top-nav { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-around; padding: 12px 16px; position: sticky; top: 60px; background: black; z-index: 99; }
        .nav-item { background: none; border: none; color: #aaa; font-size: 15px; font-weight: 600; padding: 8px 16px; cursor: pointer; position: relative; }
        .nav-item.active { color: white; }
        .nav-item.active::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 30px; height: 2px; background-color: #00ff88; border-radius: 2px; }
        
        .feed { max-width: 600px; margin: 0 auto; padding: 10px; }
        .post { background: #0a0a0a; margin-bottom: 20px; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid #1a1a1a; }
        .post-header { padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .post-header-left { display: flex; align-items: center; gap: 10px; }
        .user-avatar, .m-logo { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .post-image { width: 100%; display: block; border-top: 1px solid #111; border-bottom: 1px solid #111; }
        .post-caption { padding: 15px; font-size: 14px; color: #eee; line-height: 1.4; }
        
        .post-actions-right { position: absolute; right: 12px; top: 40%; display: flex; flex-direction: column; gap: 20px; align-items: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .action-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .action-icon i { font-size: 26px; margin-bottom: 4px; }
        .action-icon.liked i { color: #ff2c55; }
        
        /* Modals & Inputs */
        .modal, .auth-modal, .upload-modal, .edit-profile-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .upload-modal, .auth-box, .edit-profile-box { background: #111; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #333; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; background: #222; border: 1px solid #333; color: white; }
        button { cursor: pointer; transition: 0.2s; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); border-top: 1px solid #222; padding: 10px; z-index: 100; }
        .bottom-nav-items { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; }
        .plus-circle { background: white; color: black; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-top: -25px; border: 4px solid black; }

        /* Comments Styling */
        .comments-section { padding: 15px; background: #050505; border-top: 1px solid #1a1a1a; }
        .comment { margin-bottom: 12px; font-size: 13px; }
        .replies { margin-left: 30px; border-left: 1px solid #333; padding-left: 10px; }
    </style>
</head>
<body>

<!-- UI Header -->
<div class="header">
    <div class="header-content">
        <div class="logo">POIK POIK</div>
        <div class="header-icons">
            <i class="fas fa-plus-square" onclick="openUploadModal()"></i>
            <i id="authIcon" class="far fa-user-circle" onclick="toggleAuth()"></i>
        </div>
    </div>
</div>

<div class="top-nav">
    <button class="nav-item active" onclick="switchTab('feed', this)">Feed</button>
    <button class="nav-item" onclick="switchTab('explore', this)">Explore</button>
    <button class="nav-item" onclick="switchTab('following', this)">Following</button>
</div>

<!-- Main Container -->
<div id="feed" class="feed"></div>

<!-- Navigation -->
<div class="bottom-nav">
    <div class="bottom-nav-items">
        <div class="bottom-nav-item" onclick="loadFeed()"><i class="fas fa-home"></i></div>
        <div class="bottom-nav-item"><i class="fas fa-search"></i></div>
        <div class="plus-circle" onclick="openUploadModal()"><i class="fas fa-plus"></i></div>
        <div class="bottom-nav-item"><i class="far fa-heart"></i></div>
        <div class="bottom-nav-item" onclick="loadProfile()"><i class="far fa-user"></i></div>
    </div>
</div>

<!-- Modals -->
<div id="authModal" class="auth-modal">
    <div class="auth-box">
        <h3>Join Poik Poik</h3>
        <input type="email" id="authEmail" placeholder="Email Address">
        <button onclick="handleLogin()" style="width:100%; background:#00ff88; padding:12px; border-radius:10px; border:none; font-weight:bold;">Send Magic Link</button>
        <button onclick="closeModal('authModal')" style="width:100%; background:transparent; color:white; margin-top:10px; border:none;">Cancel</button>
    </div>
</div>

<div id="uploadModal" class="upload-modal">
    <div class="upload-modal-content">
        <h3>New Post</h3>
        <input type="file" id="uploadFile" accept="image/*">
        <textarea id="uploadCaption" placeholder="What's on your mind?"></textarea>
        <select id="uploadPrivacy">
            <option value="public">🌍 Public</option>
            <option value="friends">👥 Friends Only</option>
            <option value="private">🔒 Private</option>
        </select>
        <button onclick="uploadPost()" style="width:100%; background:#00ff88; padding:12px; border:none; border-radius:10px; font-weight:bold;">Post Now</button>
        <button onclick="closeModal('uploadModal')" style="width:100%; background:transparent; color:#888; margin-top:10px; border:none;">Cancel</button>
    </div>
</div>

<script>
// --- CONFIGURATION ---
const API_URL = "https://xxnuhisweolpibzthjcc.supabase.co";
const API_KEY = "sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P";
const SB = window.supabase.createClient(API_URL, API_KEY);

let USER = null;
let userLikedPosts = new Set();

// --- AUTHENTICATION ---
async function checkAuth() {
    const { data: { user } } = await SB.auth.getUser();
    USER = user;
    updateAuthUI();
    loadFeed();
}

function updateAuthUI() {
    const icon = document.getElementById('authIcon');
    if (USER) {
        icon.classList.replace('far', 'fas');
        icon.style.color = '#00ff88';
    } else {
        icon.classList.replace('fas', 'far');
        icon.style.color = '#ccc';
    }
}

async function handleLogin() {
    const email = document.getElementById('authEmail').value;
    const { error } = await SB.auth.signInWithOtp({ email });
    if (error) alert(error.message);
    else alert("Check your email for the login link!");
    closeModal('authModal');
}

function toggleAuth() {
    if (USER) {
        if (confirm("Logout?")) { SB.auth.signOut(); location.reload(); }
    } else {
        document.getElementById('authModal').style.display = 'flex';
    }
}

// --- CORE FUNCTIONS ---
async function loadFeed() {
    const feedDiv = document.getElementById('feed');
    feedDiv.innerHTML = '<p style="text-align:center; padding:20px;">Loading vibe...</p>';

    // Get User Likes
    if (USER) {
        const { data: likes } = await SB.from('post_likes').select('post_id').eq('user_id', USER.id);
        userLikedPosts = new Set(likes?.map(l => Number(l.post_id)));
    }

    const { data: posts, error } = await SB.from('posts').select(`*, profiles(username, avatar_url)`).order('created_at', { ascending: false });

    if (error) return feedDiv.innerHTML = "Error loading posts.";

    feedDiv.innerHTML = posts.map(post => renderPost(post)).join('');
}

function renderPost(post) {
    const isLiked = userLikedPosts.has(Number(post.id));
    const avatar = post.profiles?.avatar_url || 'https://via.placeholder.com/40';
    const username = post.profiles?.username || 'Anonymous';

    return `
        <div class="post" id="post-${post.id}">
            <div class="post-header">
                <div class="post-header-left">
                    <img src="${avatar}" class="user-avatar">
                    <span class="post-username">${username}</span>
                </div>
                <i class="fas fa-ellipsis-h" style="color:#555"></i>
            </div>
            <img src="${post.image_url}" class="post-image" ondblclick="likePost(${post.id})">
            <div class="post-actions-right">
                <div class="action-icon ${isLiked ? 'liked' : ''}" onclick="likePost(${post.id})">
                    <i class="fas fa-heart"></i>
                    <span>${post.likes || 0}</span>
                </div>
                <div class="action-icon" onclick="toggleComments(${post.id})">
                    <i class="fas fa-comment"></i>
                    <span>0</span>
                </div>
                <div class="action-icon">
                    <i class="fas fa-paper-plane"></i>
                </div>
            </div>
            <div class="post-caption">
                <strong>${username}</strong> ${post.caption || ''}
            </div>
            <div id="comments-${post.id}" class="comments-section" style="display:none;">
                <div id="list-${post.id}"></div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="input-${post.id}" placeholder="Add a comment..." style="margin:0; font-size:12px;">
                    <button onclick="addComment(${post.id})" style="background:#00ff88; border:none; border-radius:8px; padding:0 15px; color:black;">Post</button>
                </div>
            </div>
        </div>
    `;
}

// --- ACTIONS ---
async function likePost(postId) {
    if (!USER) return toggleAuth();
    
    const isLiked = userLikedPosts.has(Number(postId));
    
    if (isLiked) {
        await SB.from('post_likes').delete().eq('post_id', postId).eq('user_id', USER.id);
        userLikedPosts.delete(postId);
    } else {
        await SB.from('post_likes').insert({ post_id: postId, user_id: USER.id });
        userLikedPosts.add(postId);
    }
    loadFeed(); // Refresh to update count
}

async function uploadPost() {
    if (!USER) return toggleAuth();
    const file = document.getElementById('uploadFile').files[0];
    const caption = document.getElementById('uploadCaption').value;
    
    if (!file) return alert("Select an image");

    const fileName = `${USER.id}/${Date.now()}.png`;
    const { data: uploadData } = await SB.storage.from('post-images').upload(fileName, file);
    
    if (uploadData) {
        const { data: urlData } = SB.storage.from('post-images').getPublicUrl(fileName);
        await SB.from('posts').insert({
            image_url: urlData.publicUrl,
            caption: caption,
            user_id: USER.id,
            privacy: document.getElementById('uploadPrivacy').value
        });
        closeModal('uploadModal');
        loadFeed();
    }
}

// --- UI HELPERS ---
function openUploadModal() {
    if (!USER) return toggleAuth();
    document.getElementById('uploadModal').style.display = 'flex';
}

function closeModal(id) {
    document.getElementById(id).style.display = 'none';
}

function switchTab(tab, el) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    loadFeed();
}

function toggleComments(postId) {
    const el = document.getElementById(`comments-${postId}`);
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// Initialize
checkAuth();
</script>
</body>
</html>
