<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poik Poik</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background: black; 
            color: white; 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 20px;
        }
        .feed {
            max-width: 500px;
            margin: auto;
        }
        .post {
            background: #111;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }
        .post img {
            width: 100%;
            display: block;
        }
        .caption {
            padding: 10px;
            font-size: 14px;
            color: #ccc;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            font-size: 24px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            text-align: center;
        }
        .modal img {
            max-width: 100%;
            max-height: 100%;
            margin-top: 50px;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>⚡ POIK POIK</h1>
    <div class="feed" id="feed">
        <div class="loading">Loading posts...</div>
    </div>

    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modalImg" src="">
    </div>

    <script>
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function openModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            
            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                feedDiv.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
                console.error("Supabase error:", error);
                return;
            }
            
            console.log("Posts loaded:", data.length);
            
            if (!data || data.length === 0) {
                feedDiv.innerHTML = '<div class="loading">No posts yet.</div>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < data.length; i++) {
                const post = data[i];
                let caption = post.caption || 'Fashion visual';
                // Remove any prefix
                caption = caption.replace(/AI Ghost\s*[•\-]?\s*/g, '');
                html += `
                    <div class="post" onclick="openModal('${post.image_url}')">
                        <img src="${post.image_url}" loading="lazy">
                        <div class="caption">${caption}</div>
                    </div>
                `;
            }
            feedDiv.innerHTML = html;
        }
        
        loadFeed();
    </script>
</body>
</html>
