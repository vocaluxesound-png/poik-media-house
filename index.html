<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Poik Poik | AI Media House</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 60px;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: #000;
            border-bottom: 1px solid #222;
            padding: 12px 16px;
            z-index: 100;
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #00ff88;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 24px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #00ff88;
            color: #000;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
        }

        /* Feed */
        .feed {
            max-width: 600px;
            margin: 0 auto;
        }

        .post {
            margin-bottom: 20px;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
        }

        .post-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .post-username {
            font-weight: 600;
            font-size: 14px;
        }

        .post-badge {
            color: #00ff88;
            font-size: 12px;
            margin-left: 6px;
        }

        .post-caption {
            padding: 0 16px 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .post-actions {
            padding: 8px 16px;
            display: flex;
            gap: 24px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upload-area {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 2px dashed #333;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            background: #0a0a0a;
        }

        .upload-area:hover {
            border-color: #00ff88;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 12px;
            border-top: 1px solid #222;
            margin-top: 20px;
        }

        .status-badge {
            background: #00ff88;
            color: #000;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">POIK<span>POIK</span></div>
            <div id="authButtons">
                <button class="btn btn-outline" onclick="showLogin()">Login</button>
                <button class="btn btn-primary" onclick="showSignup()">Sign Up</button>
            </div>
            <div id="userInfo" style="display:none">
                <span id="userEmail"></span>
                <button class="btn btn-outline" onclick="logout()" style="margin-left:10px">Logout</button>
            </div>
        </div>
    </div>

    <div style="max-width:600px;margin:20px auto;padding:0 16px">
        <div class="upload-area" onclick="document.getElementById('uploadFile').click()">
            📸 Click to upload your own image
        </div>
        <input type="file" id="uploadFile" accept="image/*" style="display:none" onchange="uploadImage()">
        <input type="text" id="uploadCaption" placeholder="Add a caption..." style="width:100%;padding:12px;margin-top:10px;border-radius:30px;border:1px solid #333;background:#111;color:#fff;outline:none">
    </div>

    <div class="feed" id="feed">
        <div class="loading">Loading posts...</div>
    </div>

    <footer>⚡ Poik Poik • AI Media House • New image every 10 minutes</footer>

    <script>
        // ============================================
        // SUPABASE CONFIGURATION - REPLACE WITH YOUR VALUES
        // ============================================
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        
        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        // ============================================
        // LOAD POSTS FROM SUPABASE
        // ============================================
        async function loadFeed() {
            console.log("Loading feed...");
            
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = '<div class="loading">Loading posts...</div>';
            
            try {
                const { data: posts, error } = await supabase
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                console.log("Posts found:", posts ? posts.length : 0);
                
                if (error) {
                    console.error("Error loading posts:", error);
                    feedDiv.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
                    return;
                }
                
                if (!posts || posts.length === 0) {
                    feedDiv.innerHTML = '<div class="loading">✨ No posts yet. The AI Ghost is generating images. Check back in a few minutes.</div>';
                    return;
                }
                
                let html = '';
                for (const post of posts) {
                    html += `
                        <div class="post">
                            <div class="post-header">
                                <div class="post-avatar">${post.is_ai ? '🤖' : '👤'}</div>
                                <div class="post-username">
                                    ${post.is_ai ? 'Poik Ghost' : 'User'}
                                    ${post.is_ai ? '<span class="post-badge">AI</span>' : ''}
                                </div>
                            </div>
                            <img class="post-image" src="${post.image_url}" loading="lazy" alt="Post image">
                            <div class="post-caption">
                                <strong>${post.is_ai ? 'Poik Ghost' : 'User'}</strong> ${post.caption || ''}
                            </div>
                            <div class="post-actions">
                                <button class="action-btn" onclick="alert('❤️ Login to like posts')">❤️ <span class="action-count">${post.likes || 0}</span></button>
                                <button class="action-btn" onclick="alert('💬 Login to comment')">💬 <span class="action-count">0</span></button>
                            </div>
                        </div>
                    `;
                }
                feedDiv.innerHTML = html;
                
            } catch (err) {
                console.error("Unexpected error:", err);
                feedDiv.innerHTML = '<div class="loading">Error loading feed. Please refresh.</div>';
            }
        }

        // ============================================
        // UPLOAD IMAGE
        // ============================================
        async function uploadImage() {
            const file = document.getElementById('uploadFile').files[0];
            const caption = document.getElementById('uploadCaption').value;
            
            if (!file) return;
            
            if (!currentUser) {
                alert('Please login to upload images');
                showLogin();
                return;
            }
            
            try {
                const fileName = `${currentUser.id}_${Date.now()}.jpg`;
                
                const { error: uploadError } = await supabase.storage
                    .from('post-images')
                    .upload(fileName, file);
                
                if (uploadError) {
                    console.error("Upload error:", uploadError);
                    alert('Upload failed: ' + uploadError.message);
                    return;
                }
                
                const { data: urlData } = supabase.storage
                    .from('post-images')
                    .getPublicUrl(fileName);
                
                const { error: insertError } = await supabase
                    .from('posts')
                    .insert({
                        image_url: urlData.publicUrl,
                        caption: caption,
                        user_id: currentUser.id,
                        is_ai: false,
                        likes: 0
                    });
                
                if (insertError) {
                    console.error("Insert error:", insertError);
                    alert('Failed to save post');
                    return;
                }
                
                document.getElementById('uploadCaption').value = '';
                alert('Image posted successfully!');
                loadFeed();
                
            } catch (err) {
                console.error("Upload error:", err);
                alert('Upload failed');
            }
        }

        // ============================================
        // AUTH FUNCTIONS
        // ============================================
        async function checkUser() {
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                currentUser = data.session.user;
                document.getElementById('authButtons').style.display = 'none';
                document.getElementById('userInfo').style.display = 'block';
                document.getElementById('userEmail').innerText = currentUser.email.split('@')[0];
            }
        }
        
        function showLogin() {
            const email = prompt('Enter your email:');
            if (!email) return;
            const password = prompt('Enter your password:');
            if (!password) return;
            
            supabase.auth.signInWithPassword({ email, password })
                .then(({ error }) => {
                    if (error) alert(error.message);
                    else location.reload();
                });
        }
        
        function showSignup() {
            const email = prompt('Enter your email:');
            if (!email) return;
            const password = prompt('Create a password:');
            if (!password) return;
            
            supabase.auth.signUp({ email, password })
                .then(({ error }) => {
                    if (error) alert(error.message);
                    else alert('Check your email to confirm your account!');
                });
        }
        
        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }
        
        // ============================================
        // INITIALIZE
        // ============================================
        checkUser();
        loadFeed();
        
        // Refresh feed every 30 seconds
        setInterval(loadFeed, 30000);
    </script>
</body>
</html>
