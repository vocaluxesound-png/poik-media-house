<script>
// ============================================================
// MAIN APP CONTROLLER - index.html inline script
// ============================================================

let currentOpenChatUserId = null;
let refreshInterval = null;
let messagePollInterval = null;
let typingPollInterval = null;

let chatsUnreadCount = 0;
let activityUnreadCount = 0;

// -------- UTILS --------
window.escapeHtml = function(text) {
    if (!text) return '';
    return text.replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
};

window.timeAgo = function(dateString) {
    if (!dateString) return '';
    const now = new Date(), then = new Date(dateString);
    const s = Math.floor((now - then) / 1000);
    if (s < 60) return 'just now';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.floor(h / 24);
    if (d === 1) return '1 day ago';
    if (d < 7) return d + ' days ago';
    return Math.floor(d / 7) + 'w ago';
};

// -------- KEYBOARD / VIEWPORT FIX --------
// This is the KEY FIX for "mobile keyboard hides input"
// We listen to the visual viewport resize and adjust the chat container height
function setupKeyboardFix() {
    if (!window.visualViewport) return;
    window.visualViewport.addEventListener('resize', () => {
        const chatContainer = document.querySelector('.chat-container-fixed');
        if (!chatContainer) return;
        // Only apply on mobile
        if (window.innerWidth >= 768) return;
        const vvHeight = window.visualViewport.height;
        const vvOffsetTop = window.visualViewport.offsetTop;
        chatContainer.style.height = vvHeight + 'px';
        chatContainer.style.top = vvOffsetTop + 'px';
        chatContainer.style.bottom = 'auto';
        // Scroll messages to bottom when keyboard opens
        const msgs = document.getElementById('simple-chat-messages');
        if (msgs) setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 80);
    });
}
setupKeyboardFix();

// -------- UNREAD COUNTS --------
async function getUnreadMessagesCount() {
    if (!window.USER) return 0;
    try {
        let query = SB.from("messages")
            .select("*", { count: 'exact', head: true })
            .eq("receiver_id", window.USER.id)
            .eq("is_read", false);
        if (currentOpenChatUserId) query = query.neq("sender_id", currentOpenChatUserId);
        const { count } = await query;
        return count || 0;
    } catch(e) { return 0; }
}

async function getUnreadNotificationsCount() {
    if (!window.USER) return { total: 0, likes: 0, comments: 0, follows: 0 };
    try {
        const { data } = await SB.from("notifications")
            .select("type").eq("user_id", window.USER.id).eq("is_read", false);
        let likes = 0, comments = 0, follows = 0;
        if (data) for (const n of data) {
            if (n.type?.includes('like')) likes++;
            else if (n.type === 'comment' || n.type === 'reply') comments++;
            else if (n.type === 'follow') follows++;
        }
        return { total: likes + comments + follows, likes, comments, follows };
    } catch(e) { return { total: 0, likes: 0, comments: 0, follows: 0 }; }
}

// -------- GREEN PILL --------
async function showGreenPill() {
    const msgCount = await getUnreadMessagesCount();
    const notif = await getUnreadNotificationsCount();
    const total = msgCount + notif.total;
    if (total === 0) { hideGreenPill(); return; }
    let existing = document.getElementById('notification-pill');
    if (existing) existing.remove();
    let pillContent = '';
    if (notif.likes > 0) pillContent += `<span class="pill-item"><i class="fas fa-heart"></i> ${notif.likes}</span>`;
    if (notif.comments > 0) pillContent += `<span class="pill-item"><i class="fas fa-comment"></i> ${notif.comments}</span>`;
    if (notif.follows > 0) pillContent += `<span class="pill-item"><i class="fas fa-user-plus"></i> ${notif.follows}</span>`;
    if (msgCount > 0) pillContent += `<span class="pill-item"><i class="fas fa-envelope"></i> ${msgCount}</span>`;
    if (!pillContent) return;
    const inboxBtn = document.getElementById('inboxNavBtn');
    if (!inboxBtn) return;
    const rect = inboxBtn.getBoundingClientRect();
    const pill = document.createElement('div');
    pill.id = 'notification-pill';
    pill.className = 'notification-pill';
    pill.style.cssText = `position:fixed;bottom:${window.innerHeight - rect.top + 6}px;left:${rect.left + rect.width/2}px;transform:translateX(-50%);z-index:1002;cursor:pointer;`;
    pill.innerHTML = `<div class="pill-inner">${pillContent}</div><div class="pill-pointer"></div>`;
    pill.onclick = async () => {
        hideGreenPill();
        bottomNav('inbox');
        setTimeout(async () => { if (typeof switchInboxTabSimple === 'function') await switchInboxTabSimple('activity'); }, 150);
    };
    document.body.appendChild(pill);
}

function hideGreenPill() {
    const pill = document.getElementById('notification-pill');
    if (pill) pill.remove();
}

// -------- INBOX BADGE --------
async function updateInboxBadge() {
    const msgCount = await getUnreadMessagesCount();
    const dot = document.getElementById('inboxGreenDot');
    if (dot) dot.classList.toggle('show', msgCount > 0);
}

async function updateTabCounts() {
    chatsUnreadCount = await getUnreadMessagesCount();
    const notif = await getUnreadNotificationsCount();
    activityUnreadCount = notif.total;
}

function updateInboxTabBadgesOnly() {
    const chatsBtn = document.querySelector('button[onclick*="switchInboxTabSimple(\'chats\')"]');
    const actBtn   = document.querySelector('button[onclick*="switchInboxTabSimple(\'activity\')"]');
    if (chatsBtn) chatsBtn.innerHTML = `💬 Chats ${chatsUnreadCount > 0 ? `<span style="background:#2979ff;color:#fff;border-radius:10px;padding:0 6px;margin-left:4px;font-size:11px;">${chatsUnreadCount}</span>` : ''}`;
    if (actBtn)   actBtn.innerHTML   = `🔔 Activity ${activityUnreadCount > 0 ? `<span style="background:#2979ff;color:#fff;border-radius:10px;padding:0 6px;margin-left:4px;font-size:11px;">${activityUnreadCount}</span>` : ''}`;
}

// -------- MARK READ --------
async function markMessagesRead(senderId) {
    if (!window.USER) return;
    await SB.from("messages").update({ is_read: true })
        .eq("sender_id", senderId).eq("receiver_id", window.USER.id).eq("is_read", false);
    await updateTabCounts();
    await updateInboxBadge();
    updateInboxTabBadgesOnly();
    await showGreenPill();
}

async function markNotificationsAsRead() {
    if (!window.USER) return;
    await SB.from("notifications").update({ is_read: true }).eq("user_id", window.USER.id);
    await updateTabCounts();
    updateInboxTabBadgesOnly();
    await showGreenPill();
}

async function loadNotificationCounts() {
    if (!window.USER) return;
    await updateTabCounts();
    await updateInboxBadge();
    updateInboxTabBadgesOnly();
    await showGreenPill();
}

// -------- SEND MESSAGE --------
async function sendSimpleMessage(receiverId, message) {
    if (!window.USER || !message.trim()) return false;
    try {
        await SB.from("messages").insert({ sender_id: window.USER.id, receiver_id: receiverId, message: message.trim(), is_read: false });
        await loadNotificationCounts();
        return true;
    } catch(e) { return false; }
}

// -------- GET CONVERSATIONS --------
async function getSimpleConversations() {
    if (!window.USER) return [];
    try {
        const { data: messages } = await SB.from("messages").select("*")
            .or(`sender_id.eq.${window.USER.id},receiver_id.eq.${window.USER.id}`)
            .order("created_at", { ascending: false });
        if (!messages || messages.length === 0) return [];
        const convMap = new Map();
        for (const msg of messages) {
            const otherId = msg.sender_id === window.USER.id ? msg.receiver_id : msg.sender_id;
            if (!convMap.has(otherId)) {
                convMap.set(otherId, { userId: otherId, lastMessage: msg.message, lastMessageTime: msg.created_at, unreadCount: (msg.receiver_id === window.USER.id && !msg.is_read && currentOpenChatUserId !== otherId) ? 1 : 0 });
            } else {
                const c = convMap.get(otherId);
                if (msg.created_at > c.lastMessageTime) { c.lastMessage = msg.message; c.lastMessageTime = msg.created_at; }
                if (msg.receiver_id === window.USER.id && !msg.is_read && currentOpenChatUserId !== otherId) c.unreadCount++;
            }
        }
        const userIds = [...convMap.keys()];
        const { data: profiles } = await SB.from("profiles").select("id, username, avatar_url, last_seen").in("id", userIds);
        const profileMap = new Map();
        if (profiles) profiles.forEach(p => profileMap.set(p.id, p));
        const result = [];
        for (const [userId, conv] of convMap) {
            const p = profileMap.get(userId);
            const isOnline = p?.last_seen ? (new Date() - new Date(p.last_seen)) < 120000 : false;
            result.push({ userId, username: p?.username || 'User', avatarUrl: p?.avatar_url, lastMessage: conv.lastMessage, lastMessageTime: conv.lastMessageTime, unreadCount: conv.unreadCount, isOnline });
        }
        result.sort((a,b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));
        return result;
    } catch(e) { return []; }
}

// -------- GET MESSAGES --------
async function getSimpleMessages(userId) {
    if (!window.USER) return { messages: [], profile: null };
    try {
        const { data } = await SB.from("messages").select("*")
            .or(`and(sender_id.eq.${window.USER.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${window.USER.id})`)
            .order("created_at", { ascending: true });
        const { data: profile } = await SB.from("profiles").select("avatar_url, username, last_seen, id").eq("id", userId).single();
        return { messages: data || [], profile };
    } catch(e) { return { messages: [], profile: null }; }
}

// -------- TYPING --------
async function updateTypingStatus(chatWithId, isTyping) {
    if (!window.USER) return;
    try {
        const { data: existing } = await SB.from("typing_status").select("id")
            .eq("user_id", window.USER.id).eq("chat_with_id", chatWithId).single();
        if (existing) await SB.from("typing_status").update({ is_typing: isTyping, updated_at: new Date().toISOString() }).eq("id", existing.id);
        else await SB.from("typing_status").insert({ user_id: window.USER.id, chat_with_id: chatWithId, is_typing: isTyping });
    } catch(e) {}
}

async function checkTypingStatus(chatWithId) {
    if (!window.USER) return false;
    try {
        const { data } = await SB.from("typing_status").select("is_typing, updated_at")
            .eq("user_id", chatWithId).eq("chat_with_id", window.USER.id).single();
        if (data?.is_typing && (new Date() - new Date(data.updated_at)) < 5000) return true;
        return false;
    } catch(e) { return false; }
}

function showTypingIndicator(show) {
    let indicator = document.getElementById('typing-indicator');
    const container = document.getElementById('simple-chat-messages');
    if (show && !indicator && container) {
        indicator = document.createElement('div');
        indicator.id = 'typing-indicator';
        indicator.className = 'typing-indicator';
        indicator.innerHTML = '<span></span><span></span><span></span>';
        container.appendChild(indicator);
        container.scrollTop = container.scrollHeight;
    } else if (!show && indicator) {
        indicator.remove();
    }
}

function startTypingPolling(chatWithId) {
    if (typingPollInterval) clearInterval(typingPollInterval);
    typingPollInterval = setInterval(async () => {
        if (currentOpenChatUserId === chatWithId) showTypingIndicator(await checkTypingStatus(chatWithId));
    }, 2000);
}

function stopTypingPolling() {
    if (typingPollInterval) clearInterval(typingPollInterval);
    typingPollInterval = null;
    showTypingIndicator(false);
}

// -------- INBOX --------
let inboxTab = 'chats';

async function loadSimpleInbox() {
    const feedDiv = document.getElementById("feed");
    if (!feedDiv) return;
    if (!window.USER) { alert('Please login'); openAuthModal(); return; }
    window.isProfileView = true;
    window.isFriendsView = false;
    const topNav = document.querySelector('.top-nav');
    if (topNav) topNav.style.display = 'none';
    feedDiv.innerHTML = '<div class="loading">Loading inbox...</div>';
    await updateTabCounts();
    await renderSimpleInbox();
}

async function renderSimpleInbox() {
    const feedDiv = document.getElementById("feed");
    feedDiv.innerHTML = `
        <div style="max-width:600px;margin:0 auto;padding-bottom:80px;">
            <div style="padding:16px;border-bottom:1px solid #111;"><h2 style="font-size:20px;font-family:'Syne',sans-serif;">Inbox</h2></div>
            <div style="display:flex;border-bottom:1px solid #1a1a1a;">
                <button onclick="window.switchInboxTabSimple('chats')" style="flex:1;background:none;border:none;padding:13px;color:${inboxTab==='chats'?'#2979ff':'#666'};border-bottom:2px solid ${inboxTab==='chats'?'#2979ff':'transparent'};cursor:pointer;font-weight:700;font-size:14px;">
                    💬 Chats ${chatsUnreadCount > 0 ? `<span style="background:#2979ff;color:#fff;border-radius:10px;padding:0 6px;margin-left:4px;font-size:11px;">${chatsUnreadCount}</span>` : ''}
                </button>
                <button onclick="window.switchInboxTabSimple('activity')" style="flex:1;background:none;border:none;padding:13px;color:${inboxTab==='activity'?'#2979ff':'#666'};border-bottom:2px solid ${inboxTab==='activity'?'#2979ff':'transparent'};cursor:pointer;font-weight:700;font-size:14px;">
                    🔔 Activity ${activityUnreadCount > 0 ? `<span style="background:#2979ff;color:#fff;border-radius:10px;padding:0 6px;margin-left:4px;font-size:11px;">${activityUnreadCount}</span>` : ''}
                </button>
            </div>
            <div id="inbox-content-simple">${inboxTab==='chats'?'<div class="loading">Loading chats...</div>':'<div class="loading">Loading notifications...</div>'}</div>
        </div>`;
    if (inboxTab === 'chats') await renderSimpleChats();
    else await renderSimpleActivity();
}

async function renderSimpleChats() {
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    const conversations = await getSimpleConversations();
    if (conversations.length === 0) { container.innerHTML = '<div style="text-align:center;padding:60px;color:#555;">No messages yet<br><span style="font-size:12px;">Find people and start chatting!</span></div>'; return; }
    let html = '';
    for (const conv of conversations) {
        html += `
        <div onclick="openSimpleChat('${conv.userId}')" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #0d0d0d;cursor:pointer;transition:background 0.15s;" onmouseover="this.style.background='#0d0d0d'" onmouseout="this.style.background='transparent'">
            <div style="position:relative;flex-shrink:0;">
                ${conv.avatarUrl ? `<img src="${conv.avatarUrl}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">` : `<div style="width:50px;height:50px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:22px;">👤</div>`}
                ${conv.isOnline ? `<div style="position:absolute;bottom:1px;right:1px;" class="online-dot"></div>` : ''}
            </div>
            <div style="flex:1;min-width:0;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
                    <span style="font-weight:700;font-size:14px;">${escapeHtml(conv.username)}</span>
                    <span style="font-size:10px;color:#555;">${timeAgo(conv.lastMessageTime)}</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:13px;color:${conv.unreadCount>0?'#fff':'#666'};font-weight:${conv.unreadCount>0?'600':'400'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">${escapeHtml(conv.lastMessage.substring(0,40))}</span>
                    ${conv.unreadCount>0 ? `<span style="background:#2979ff;color:#fff;border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700;">${conv.unreadCount}</span>` : ''}
                </div>
            </div>
        </div>`;
    }
    container.innerHTML = html;
}

// -------- OPEN CHAT --------
async function openSimpleChat(userId) {
    // Prevent body scroll while chat is open
    document.body.style.overflow = 'hidden';
    currentOpenChatUserId = userId;
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    container.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:200px;"><div class="loading">Loading chat...</div></div>';
    const result = await getSimpleMessages(userId);
    const { messages, profile } = result;
    const isOnline = profile?.last_seen ? (new Date() - new Date(profile.last_seen)) < 120000 : false;

    // Render messages HTML (initial load)
    let messagesHtml = renderMessagesHTML(messages);

    // Build chat UI
    container.innerHTML = `
        <div class="chat-container-fixed" id="chatContainerFixed">
            <!-- Header -->
            <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #1a1a1a;background:#0a0a0a;flex-shrink:0;">
                <button onclick="closeSimpleChat()" style="background:none;border:none;color:#2979ff;font-size:22px;cursor:pointer;padding:0 4px;flex-shrink:0;">←</button>
                <div onclick="goToProfileFromChat('${userId}')" style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;">
                    <div style="position:relative;flex-shrink:0;">
                        ${profile?.avatar_url ? `<img src="${profile.avatar_url}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">` : `<div style="width:40px;height:40px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:20px;">👤</div>`}
                        ${isOnline ? `<div style="position:absolute;bottom:0;right:0;" class="online-dot"></div>` : ''}
                    </div>
                    <div>
                        <div style="font-weight:700;font-size:15px;">${escapeHtml(profile?.username || 'User')}</div>
                        <div style="font-size:11px;color:${isOnline?'#00e676':'#555'};">${isOnline ? '● Active now' : (profile?.last_seen ? 'Last seen ' + timeAgo(profile.last_seen) : 'Offline')}</div>
                    </div>
                </div>
            </div>
            <!-- Messages -->
            <div id="simple-chat-messages" class="chat-messages-fixed">${messagesHtml}</div>
            <!-- Input -->
            <div class="chat-input-fixed" id="chatInputArea">
                <input type="text" id="simple-chat-input" placeholder="Message..." autocomplete="off"
                    oninput="handleChatTyping('${userId}')"
                    onkeypress="if(event.key==='Enter'){event.preventDefault();sendSimpleChatMessage();}">
                <button onclick="sendSimpleChatMessage()" aria-label="Send">
                    <i class="fas fa-paper-plane" style="font-size:16px;"></i>
                </button>
            </div>
        </div>`;

    // Scroll to bottom
    const msgContainer = document.getElementById('simple-chat-messages');
    if (msgContainer) setTimeout(() => { msgContainer.scrollTop = msgContainer.scrollHeight; }, 50);

    // Mark read, setup polling
    setTimeout(async () => {
        await markMessagesRead(userId);
        await loadNotificationCounts();
    }, 100);

    startTypingPolling(userId);

    if (messagePollInterval) clearInterval(messagePollInterval);
    messagePollInterval = setInterval(async () => { if (currentOpenChatUserId) await refreshSimpleChatMessages(); }, 3000);

    // Re-apply keyboard fix to the new container
    setupKeyboardFix();
}

// Typing debounce
let typingTimeout = null;
function handleChatTyping(chatWithId) {
    if (typingTimeout) clearTimeout(typingTimeout);
    updateTypingStatus(chatWithId, true);
    typingTimeout = setTimeout(() => updateTypingStatus(chatWithId, false), 3000);
}

function renderMessagesHTML(messages) {
    if (!messages || messages.length === 0) return '<div style="text-align:center;padding:40px;color:#555;">No messages yet. Say hi! 👋</div>';
    let html = '';
    for (const msg of messages) {
        const isMine = msg.sender_id === window.USER?.id;
        html += `
        <div style="display:flex;justify-content:${isMine?'flex-end':'flex-start'};margin-bottom:6px;">
            <div class="message-bubble ${isMine?'message-bubble-mine':'message-bubble-theirs'}">
                ${escapeHtml(msg.message)}
                <div style="font-size:9px;color:${isMine?'rgba(255,255,255,0.6)':'#555'};margin-top:3px;text-align:right;">${timeAgo(msg.created_at)}</div>
            </div>
        </div>`;
    }
    return html;
}

// Refresh — only append new messages, no full re-render
let lastMessageCount = 0;
async function refreshSimpleChatMessages() {
    if (!currentOpenChatUserId) return;
    const result = await getSimpleMessages(currentOpenChatUserId);
    const messages = result.messages;
    const container = document.getElementById('simple-chat-messages');
    if (!container) return;
    if (messages.length === lastMessageCount) return; // Nothing new
    const wasNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 140;
    // Append only new messages
    const newMessages = messages.slice(lastMessageCount);
    lastMessageCount = messages.length;
    if (newMessages.length > 0) {
        const fragment = document.createDocumentFragment();
        for (const msg of newMessages) {
            const isMine = msg.sender_id === window.USER?.id;
            const div = document.createElement('div');
            div.style.cssText = `display:flex;justify-content:${isMine?'flex-end':'flex-start'};margin-bottom:6px;`;
            div.innerHTML = `<div class="message-bubble ${isMine?'message-bubble-mine':'message-bubble-theirs'}">${escapeHtml(msg.message)}<div style="font-size:9px;color:${isMine?'rgba(255,255,255,0.6)':'#555'};margin-top:3px;text-align:right;">${timeAgo(msg.created_at)}</div></div>`;
            fragment.appendChild(div);
        }
        container.appendChild(fragment);
        if (wasNearBottom) container.scrollTop = container.scrollHeight;
    }
}

async function sendSimpleChatMessage() {
    const input = document.getElementById('simple-chat-input');
    const message = input?.value.trim();
    if (!message || !currentOpenChatUserId) return;
    input.value = '';
    if (typingTimeout) clearTimeout(typingTimeout);
    await updateTypingStatus(currentOpenChatUserId, false);
    const success = await sendSimpleMessage(currentOpenChatUserId, message);
    if (success) {
        await refreshSimpleChatMessages();
        // Also reset count so next poll is correct
        lastMessageCount = 0;
        await refreshSimpleChatMessages();
    }
}

async function closeSimpleChat() {
    document.body.style.overflow = '';
    if (currentOpenChatUserId) await markMessagesRead(currentOpenChatUserId);
    stopTypingPolling();
    if (messagePollInterval) clearInterval(messagePollInterval);
    messagePollInterval = null;
    currentOpenChatUserId = null;
    lastMessageCount = 0;
    await updateTabCounts();
    updateInboxTabBadgesOnly();
    await renderSimpleInbox();
}

async function switchInboxTabSimple(tab) {
    if (inboxTab === tab) return;
    inboxTab = tab;
    await renderSimpleInbox();
}

// -------- NOTIFICATIONS / ACTIVITY --------
async function createSimpleNotification(type, userId, actorId, targetId) {
    if (!userId || !actorId || userId === actorId) return;
    try {
        const { data: recent } = await SB.from("notifications").select("id")
            .eq("user_id", userId).eq("actor_id", actorId).eq("type", type)
            .eq("target_id", targetId || 0)
            .gte("created_at", new Date(Date.now() - 10000).toISOString());
        if (recent && recent.length > 0) return;
        await SB.from("notifications").insert({ user_id: userId, actor_id: actorId, type, target_id: targetId || 0, is_read: false });
        await loadNotificationCounts();
    } catch(e) {}
}

async function openNotificationTarget(type, targetId) {
    bottomNav('home');
    setTimeout(async () => {
        const postEl = document.querySelector(`[data-post-id="${targetId}"]`);
        if (postEl) {
            postEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            postEl.style.transition = '0.3s';
            postEl.style.boxShadow = '0 0 0 2px #2979ff';
            setTimeout(() => { postEl.style.boxShadow = ''; }, 2000);
            if (type === 'comment' || type === 'reply') {
                const btn = postEl.querySelector('.action-icon[onclick*="toggleComments"]');
                if (btn) btn.click();
            }
        }
    }, 700);
}

async function renderSimpleActivity() {
    const container = document.getElementById('inbox-content-simple');
    if (!container) return;
    container.innerHTML = '<div class="loading">Loading notifications...</div>';
    try {
        const { data: notifications, error } = await SB.from('notifications')
            .select('*').eq('user_id', window.USER.id)
            .order('created_at', { ascending: false }).limit(100);
        if (error || !notifications?.length) {
            container.innerHTML = '<div style="text-align:center;padding:60px;color:#555;"><i class="fas fa-bell" style="font-size:44px;margin-bottom:14px;opacity:0.3;display:block;"></i>No notifications yet</div>';
            return;
        }
        const actorIds = [...new Set(notifications.map(n => n.actor_id).filter(Boolean))];
        let actorMap = new Map();
        if (actorIds.length > 0) {
            const { data: actors } = await SB.from('profiles').select('id, username, avatar_url').in('id', actorIds);
            if (actors) actors.forEach(a => actorMap.set(a.id, a));
        }
        let html = '';
        for (const n of notifications) {
            const actor = actorMap.get(n.actor_id);
            const actorName = actor?.username || 'Someone';
            const timeText = window.timeAgo ? window.timeAgo(n.created_at) : '';
            let icon = '🔔', text = '', clickAction = '';
            if (n.type?.includes('like')) { icon = '❤️'; text = 'liked your post'; clickAction = `openNotificationTarget('${n.type}', ${n.target_id})`; }
            else if (n.type === 'comment' || n.type === 'reply') { icon = '💬'; text = 'commented on your post'; clickAction = `openNotificationTarget('${n.type}', ${n.target_id})`; }
            else if (n.type === 'follow') { icon = '👤'; text = 'started following you'; clickAction = `viewProfile('${n.actor_id}')`; }
            html += `
            <div onclick="${clickAction}" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #0d0d0d;cursor:pointer;background:${n.is_read?'transparent':'rgba(41,121,255,0.04)'};" onmouseover="this.style.background='#0d0d0d'" onmouseout="this.style.background='${n.is_read?'transparent':'rgba(41,121,255,0.04)'}'">
                <div style="width:44px;height:44px;border-radius:50%;overflow:hidden;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">
                    ${actor?.avatar_url ? `<img src="${actor.avatar_url}" style="width:100%;height:100%;object-fit:cover;">` : '👤'}
                </div>
                <div style="flex:1;">
                    <div style="font-size:14px;"><strong>${window.escapeHtml(actorName)}</strong> ${text}</div>
                    <div style="font-size:11px;color:#555;margin-top:4px;">${timeText}</div>
                </div>
                <div style="font-size:20px;">${icon}</div>
                ${!n.is_read ? '<div style="width:8px;height:8px;background:#2979ff;border-radius:50%;flex-shrink:0;"></div>' : ''}
            </div>`;
        }
        container.innerHTML = html;
        await SB.from('notifications').update({ is_read: true }).eq('user_id', window.USER.id);
        await loadNotificationCounts();
    } catch(e) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:#ff1744;">Error loading activity</div>';
    }
}

// -------- PROFILE FROM CHAT --------
async function goToProfileFromChat(userId) {
    if (messagePollInterval) { clearInterval(messagePollInterval); messagePollInterval = null; }
    if (typingPollInterval) { clearInterval(typingPollInterval); typingPollInterval = null; }
    currentOpenChatUserId = null;
    if (typeof viewProfile === 'function') await viewProfile(userId);
}

async function viewPostAndComments(postId) {
    goToHome();
    setTimeout(() => {
        const section = document.getElementById(`comments-${postId}`);
        if (section) {
            section.style.display = 'block';
            if (typeof loadCommentsOnly === 'function') loadCommentsOnly(postId);
        }
    }, 500);
}

function goToHome() {
    document.body.style.overflow = '';
    window.isProfileView = false;
    window.isFriendsView = false;
    document.querySelectorAll('.bottom-nav-item').forEach(i => i.classList.remove('active'));
    document.querySelector('.bottom-nav-item:first-child')?.classList.add('active');
    const topNav = document.querySelector('.top-nav');
    if (topNav) topNav.style.display = 'flex';
    if (typeof refreshFeed === 'function') refreshFeed();
}

function startAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(async () => {
        await updateTabCounts();
        await updateInboxBadge();
        updateInboxTabBadgesOnly();
        await showGreenPill();
        if (inboxTab === 'chats' && !currentOpenChatUserId && document.getElementById('inbox-content-simple')) {
            await renderSimpleChats();
        }
    }, 10000);
}

// -------- BOTTOM NAV --------
window.bottomNav = function(page) {
    document.body.style.overflow = '';
    document.querySelectorAll('.bottom-nav-item').forEach(i => i.classList.remove('active'));
    if (page === 'home') {
        document.querySelector('.bottom-nav-item:first-child')?.classList.add('active');
        goToHome();
    } else if (page === 'friends') {
        document.querySelector('.bottom-nav-item:nth-child(2)')?.classList.add('active');
        window.isFriendsView = true;
        window.isProfileView = false;
        if (typeof loadFriends === 'function') loadFriends();
    } else if (page === 'inbox') {
        document.querySelector('.bottom-nav-item:nth-child(4)')?.classList.add('active');
        if (!window.USER) { alert('Please login'); openAuthModal(); return; }
        loadSimpleInbox();
    } else if (page === 'profile') {
        document.querySelector('.bottom-nav-item:last-child')?.classList.add('active');
        if (typeof loadProfile === 'function') loadProfile();
    }
};

// -------- INIT --------
(async function() {
    const sessionRestored = await restoreSession();
    if (!sessionRestored) await checkAuth();
    if (typeof loadFeed === 'function') loadFeed();
    if (window.USER) {
        await loadNotificationCounts();
        setTimeout(() => startAutoRefresh(), 2000);
    }
})();

// Re-check on window focus
window.addEventListener('focus', async () => { if (window.USER) await loadNotificationCounts(); });

// -------- EXPOSE GLOBALS --------
window.loadInbox = loadSimpleInbox;
window.openChat = openSimpleChat;
window.closeChat = closeSimpleChat;
window.sendChatMessage = sendSimpleChatMessage;
window.switchInboxTabSimple = switchInboxTabSimple;
window.showGreenPill = showGreenPill;
window.updateInboxBadge = updateInboxBadge;
window.createNotification = createSimpleNotification;
window.createSimpleNotification = createSimpleNotification;
window.goToProfileFromChat = goToProfileFromChat;
window.updateTypingStatus = updateTypingStatus;
window.viewPostAndComments = viewPostAndComments;
window.loadNotificationCounts = loadNotificationCounts;
window.updateInboxTabBadgesOnly = updateInboxTabBadgesOnly;
window.openNotificationTarget = openNotificationTarget;
window.goToHome = goToHome;
</script>
