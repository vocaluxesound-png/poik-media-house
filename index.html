<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:black;color:white;font-family:sans-serif;padding:20px">
    <h2>⚡ POIK POIK FEED</h2>
    <div id="feed">Loading...</div>

    <script>
        // SINGLE DECLARATION - NO DUPLICATES
        const SUPABASE_URL = 'https://xxnuhisweolpibzthjcc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_jDMX1LcHK465QrACNqeXVA_WmE7mW0P';
        
        // Create client only once
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = 'Loading posts...';
            
            try {
                const { data, error } = await _supabase
                    .from('posts')
                    .select('*')
                    .order('id', { ascending: false });
                
                console.log('Data:', data);
                console.log('Error:', error);
                
                if (error) {
                    feedDiv.innerHTML = 'Error: ' + error.message;
                    return;
                }
                
                if (!data || data.length === 0) {
                    feedDiv.innerHTML = 'No posts found. Ghost is creating images...';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < data.length; i++) {
                    const post = data[i];
                    html += `
                        <div style="margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px;">
                            <img src="${post.image_url}" style="width: 100%; max-width: 500px; border-radius: 10px;" 
                                 onerror="this.style.display='none'">
                            <p style="margin-top: 10px;">✨ ${post.caption || 'Fashion'}</p>
                            <small>❤️ ${post.likes || 0} likes</small>
                        </div>
                    `;
                }
                feedDiv.innerHTML = html;
                
            } catch (err) {
                feedDiv.innerHTML = 'Error: ' + err.message;
                console.error(err);
            }
        }
        
        // Direct fetch test
        async function testFetch() {
            const response = await fetch(SUPABASE_URL + '/rest/v1/posts?select=*', {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                }
            });
            const data = await response.json();
            console.log('Direct fetch:', data);
        }
        
        loadFeed();
        testFetch();
    </script>
</body>
</html>
